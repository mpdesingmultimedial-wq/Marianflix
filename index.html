<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Marianflix • Películas, Series y TV en Vivo</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
  <script src="catalog-fallback.js"></script>
  <style>
    :root {
      --bg: #080b14;
      --bg-elev: #0e1528;
      --bg-card: #121a2c;
      --red: #e50914;
      --red-hover: #f6121d;
      --glow: #8ceaff;
      --green: #46d369;
      --text: #ffffff;
      --text-dim: #cfd9e8;
      --text-muted: #92a2ba;
      --border: rgba(255, 255, 255, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* APK Exact App Shell: Left NavRail (>=600px) + Main Scrollable Content (Netflix + Disney+ Midnight) */
    .app-shell {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #080b14 0%, #0e1528 50%, #080b14 100%);
    }
    .nav-rail {
      width: 92px;
      flex-shrink: 0;
      height: 100vh;
      background: linear-gradient(180deg, #0a0f1c 0%, #0e1629 50%, #090d18 100%);
      border-right: 1px solid #1b2940;
      padding: 12px 7px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow-y: auto;
      z-index: 100;
    }
    .rail-item {
      width: 100%;
      background: transparent;
      border: 1.5px solid transparent;
      border-radius: 12px;
      padding: 9px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #d6e2f0;
      cursor: pointer;
      position: relative;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.15s;
      font-family: inherit;
    }
    .rail-item svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      flex-shrink: 0;
    }
    .rail-item span {
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .rail-item:hover, .rail-item:focus-visible {
      background: #182a42;
      border-color: #8ceaff;
      color: #8ceaff;
      transform: scale(1.04);
      outline: none;
    }
    .rail-item.active {
      background: #281622;
      border-color: rgba(229, 9, 20, 0.45);
      color: #ff4d57;
    }
    .rail-item.active::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 24px;
      border-radius: 2px;
      background: #e50914;
    }
    .rail-item.active span {
      font-weight: 700;
    }
    .app-main {
      flex: 1;
      min-width: 0;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      background: linear-gradient(180deg, #080b14 0%, #0e1528 50%, #080b14 100%);
    }

    /* Disney+-style Brand / Genre Hub Cards */
    .disney-hub-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 6px 24px 10px;
      scrollbar-width: none;
    }
    .disney-hub-row::-webkit-scrollbar { display: none; }
    .disney-hub-card {
      flex: 0 0 156px;
      height: 74px;
      border-radius: 12px;
      border: 1.5px solid rgba(255,255,255,0.22);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      color: #fff;
      text-align: left;
      transition: transform 0.16s, border-color 0.16s, box-shadow 0.16s;
      font-family: inherit;
    }
    .disney-hub-card:hover, .disney-hub-card:focus-visible {
      transform: scale(1.05);
      border-color: #8ceaff;
      box-shadow: 0 8px 22px rgba(0,0,0,0.45), 0 0 12px rgba(140,234,255,0.3);
      outline: none;
    }
    .disney-hub-card.active {
      border-color: #e50914;
      box-shadow: 0 0 14px rgba(229,9,20,0.35);
    }
    .disney-hub-title {
      font-size: 14px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .disney-hub-sub {
      font-size: 11px;
      color: rgba(218, 228, 242, 0.85);
      font-weight: 600;
    }

    /* Sub-category pills inside Live TV sections */
    .subcat-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0 6px;
      scrollbar-width: none;
    }
    .subcat-row::-webkit-scrollbar { display: none; }
    .subcat-pill {
      flex: 0 0 auto;
      background: #101826;
      color: #bbd0e4;
      border: 1px solid #233246;
      padding: 5px 11px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.14s;
      font-family: inherit;
    }
    .subcat-pill:hover, .subcat-pill:focus-visible {
      border-color: #ffffff;
      color: #8ceaff;
      outline: none;
    }
    .subcat-pill.active {
      background: #1a3a4a;
      border-color: #8ceaff;
      color: #8ceaff;
    }
    .flow-sub-tag {
      background: #142030;
      border: 1px solid rgba(140, 234, 255, 0.35);
      color: #8ceaff;
      font-size: 9px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 3px;
      white-space: nowrap;
    }

    /* Brand & Hero Top Floating Bar (Matches APK HomeScreen) */
    .hero-top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 24px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .brand-m {
      background: var(--red);
      color: #fff;
      font-weight: 900;
      font-size: 20px;
      padding: 2px 9px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 10px rgba(229,9,20,0.45);
    }
    .brand-text {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #fff;
    }
    .hero-quick-pills {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      max-width: 100%;
    }
    .search-input {
      background: rgba(20, 20, 30, 0.9);
      border: 1px solid #35354a;
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      width: 100%;
      transition: border-color 0.2s;
    }
    .search-input::placeholder { color: #9eb0c2; }
    .search-input:focus {
      outline: none;
      border-color: var(--red);
    }

    /* Netflix Hero Billboard */
    .hero {
      position: relative;
      width: 100%;
      height: 410px;
      min-height: 360px;
      display: flex;
      align-items: flex-end;
      padding: 74px 24px 22px;
      background-size: cover;
      background-position: center top;
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(11,11,15,0.96) 0%, rgba(11,11,15,0.72) 48%, rgba(11,11,15,0.18) 100%),
        linear-gradient(180deg, rgba(11,11,15,0.75) 0%, rgba(11,11,15,0.1) 35%, rgba(11,11,15,0.88) 85%, #0b0b0f 100%);
    }
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .hero-top-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #fff;
    }
    .top10-pill {
      background: var(--red);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 7px;
      border-radius: 4px;
    }
    .hero-title {
      font-size: clamp(28px, 4.5vw, 52px);
      font-weight: 900;
      line-height: 1.08;
      color: #fff;
      text-shadow: 0 4px 18px rgba(0,0,0,0.85);
    }
    .hero-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
    }
    .match-text { color: var(--green); }
    .hd-badge {
      border: 1px solid rgba(255,255,255,0.65);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 11px;
      color: #fff;
    }
    .score-text { color: #ffd54f; }
    .hero-genres {
      font-size: 13px;
      color: #e2e3ef;
      font-weight: 600;
    }
    .hero-synopsis {
      font-size: 15px;
      line-height: 1.45;
      color: #dcdde8;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .hero-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 6px;
    }
    .btn-play-netflix {
      background: #ffffff;
      color: #000000;
      border: none;
      font-size: 16px;
      font-weight: 800;
      padding: 11px 24px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s, background 0.15s;
    }
    .btn-play-netflix:hover, .btn-play-netflix:focus-visible {
      background: var(--red);
      color: #ffffff;
      transform: scale(1.03);
      outline: 2px solid #fff;
    }
    .btn-info-netflix {
      background: rgba(65, 65, 82, 0.78);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.28);
      font-size: 15px;
      font-weight: 700;
      padding: 11px 20px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }
    .btn-info-netflix:hover, .btn-info-netflix:focus-visible {
      background: rgba(95, 95, 118, 0.9);
      outline: 2px solid #fff;
    }
    .hero-dots {
      display: flex;
      gap: 7px;
      margin-top: 6px;
    }
    .hero-dot {
      width: 10px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.38);
      cursor: pointer;
      transition: all 0.2s;
    }
    .hero-dot.active {
      width: 26px;
      background: var(--red);
    }

    /* Shelves / Rows */
    .rows-container {
      display: flex;
      flex-direction: column;
      gap: 26px;
      padding: 10px 28px 30px;
    }
    .shelf-title {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .shelf-scroller {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 6px 2px 14px;
      scroll-behavior: smooth;
    }
    .shelf-scroller::-webkit-scrollbar { height: 6px; }
    .shelf-scroller::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.22);
      border-radius: 3px;
    }

    /* Poster Card */
    .poster-card {
      flex: 0 0 156px;
      width: 156px;
      cursor: pointer;
      transition: transform 0.2s ease;
      position: relative;
    }
    .poster-card:hover, .poster-card:focus-visible {
      transform: scale(1.05);
      z-index: 4;
    }
    .poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .poster-card:hover .poster-wrap {
      border-color: #ffffff;
      box-shadow: 0 8px 22px rgba(0,0,0,0.75);
    }
    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-badge-m {
      position: absolute;
      top: 6px;
      left: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .mini-m {
      background: var(--red);
      color: #fff;
      font-weight: 900;
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 3px;
    }
    .mini-year {
      background: rgba(11,11,15,0.85);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .mini-score {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(11,11,15,0.88);
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .rank-ribbon {
      position: absolute;
      top: 0;
      left: 0;
      background: var(--red);
      color: #fff;
      padding: 3px 8px;
      border-bottom-right-radius: 8px;
      text-align: center;
      line-height: 1.05;
    }
    .rank-ribbon small { font-size: 8px; font-weight: 900; display: block; }
    .rank-ribbon strong { font-size: 15px; font-weight: 900; }
    .card-progress-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: rgba(255,255,255,0.28);
    }
    .card-progress-fill {
      height: 100%;
      background: var(--red);
    }
    .poster-title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .poster-sub {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Filter Browser Page (Movies, Series, Live TV) */
    .browser-page {
      padding: 18px 22px 32px;
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }
    .page-title {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
    }
    .pills-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }
    .pills-row::-webkit-scrollbar { height: 5px; }
    .pills-row::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    .pill {
      flex: 0 0 auto;
      background: #1c1c28;
      color: #ffffff;
      border: 1.5px solid #343448;
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .pill:hover, .pill:focus-visible {
      border-color: #ffffff;
      background: #2c2c3e;
    }
    .pill.active {
      background: var(--red);
      border-color: var(--red);
      font-weight: 800;
    }
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
      margin-top: 14px;
    }
    .media-grid .poster-card {
      width: 100%;
      flex: none;
    }

    /* Detail & Player Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.84);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; }
    .detail-box {
      background: #14141d;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      max-width: 880px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
    }
    .detail-hero {
      position: relative;
      height: 300px;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 24px;
    }
    .detail-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(20,20,29,0.2) 0%, rgba(20,20,29,0.96) 92%, #14141d 100%);
    }
    .close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 5;
      background: rgba(15,15,22,0.85);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }
    .detail-body {
      padding: 0 24px 26px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .ep-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .ep-row {
      background: #1c1c28;
      border: 1px solid #2e2e42;
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .ep-row:hover {
      border-color: var(--red);
      background: #242436;
    }

    /* Fullscreen Player Modal */
    .player-modal {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 300;
      display: none;
      flex-direction: column;
    }
    .player-modal.open { display: flex; }
    .player-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.78);
      gap: 12px;
      z-index: 5;
    }
    .player-res-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 6px;
      background: #142824;
      border: 1px solid #00e5b4;
      color: #00e5b4;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .player-enh-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 6px;
      background: #2b220e;
      border: 1px solid #ffd54f;
      color: #ffd54f;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }
    #videoEl.mf-enhance-hd_plus {
      filter: url(#mfEnhanceHdPlus) contrast(1.06) saturate(1.10) brightness(1.02);
      image-rendering: high-quality;
    }
    #videoEl.mf-enhance-ultra {
      filter: url(#mfEnhanceUltra) contrast(1.10) saturate(1.16) brightness(1.03);
      image-rendering: high-quality;
    }
    #videoEl.mf-enhance-off {
      filter: none;
    }
    .player-video-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 60px);
      background: #000;
    }
    .sub-overlay {
      position: absolute;
      bottom: 64px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.82);
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 8px;
      font-size: clamp(15px, 2.2vw, 22px);
      font-weight: 700;
      text-align: center;
      max-width: 86%;
      pointer-events: none;
      display: none;
    }
    .track-panel {
      position: absolute;
      top: 60px;
      right: 20px;
      background: #161622;
      border: 1px solid #3c3c54;
      border-radius: 12px;
      padding: 16px;
      width: 280px;
      max-height: 75vh;
      overflow-y: auto;
      z-index: 20;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .track-panel.open { display: flex; }

    /* Netflix-style Player Controls Overlay */
    .nf-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, transparent 25%, transparent 68%, rgba(0,0,0,0.88) 100%);
      transition: opacity 0.25s ease;
      z-index: 8;
      pointer-events: none;
    }
    .nf-overlay.hidden { opacity: 0; }
    .nf-overlay > * { pointer-events: auto; }
    .nf-center-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 34px;
      margin: auto 0;
    }
    .nf-ctrl-btn {
      background: rgba(20, 20, 30, 0.72);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.65);
      border-radius: 50%;
      width: 62px;
      height: 62px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s, background 0.15s;
    }
    .nf-ctrl-btn.big {
      width: 78px;
      height: 78px;
      font-size: 28px;
      background: rgba(229, 9, 20, 0.9);
      border-color: #fff;
    }
    .nf-ctrl-btn:hover { transform: scale(1.1); background: rgba(229, 9, 20, 0.92); }
    .nf-bottom-bar {
      padding: 12px 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .nf-scrubber-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }
    .nf-slider {
      flex: 1;
      accent-color: #e50914;
      height: 6px;
      cursor: pointer;
    }
    .nf-toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      padding: 10px 22px;
      border-radius: 30px;
      z-index: 15;
      display: none;
      pointer-events: none;
    }

    /* Responsive Mobile Bottom Bar */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #14141e;
      border-top: 1px solid rgba(255,255,255,0.12);
      z-index: 120;
      justify-content: space-evenly;
      padding: 6px 4px;
    }
    .mob-tab {
      flex: 1;
      background: transparent;
      border: none;
      border-radius: 8px;
      padding: 6px 2px;
      color: #e0e0ec;
      font-size: 10px;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }
    .mob-tab svg { width: 20px; height: 20px; fill: currentColor; }
    .mob-tab.active { background: #28161c; color: #ff4d57; font-weight: 700; }

    /* Flow-style Live TV Guide */
    .flow-page {
      padding: 14px 18px 24px;
      background: #0a0e14;
      min-height: 100vh;
    }
    .flow-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }
    .flow-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .flow-badge {
      background: #00e5b4;
      color: #041411;
      font-weight: 900;
      font-size: 16px;
      padding: 3px 11px;
      border-radius: 6px;
      letter-spacing: 0.4px;
    }
    .flow-live-clock {
      background: #142824;
      border: 1px solid #00e5b4;
      color: #00e5b4;
      font-weight: 800;
      font-size: 13px;
      padding: 5px 12px;
      border-radius: 16px;
    }
    .flow-pill {
      flex: 0 0 auto;
      background: #141d28;
      color: #fff;
      border: 1.5px solid #263547;
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .flow-pill:hover { border-color: #fff; background: #20313d; }
    .flow-pill.active {
      background: #00e5b4;
      border-color: #00e5b4;
      color: #041411;
      font-weight: 800;
    }
    .flow-split {
      display: grid;
      grid-template-columns: 1.25fr 0.85fr;
      gap: 16px;
      margin-top: 12px;
      align-items: start;
    }
    .flow-guide-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 70vh;
      overflow-y: auto;
      padding-right: 4px;
    }
    .flow-row {
      background: #131a24;
      border: 1.5px solid #1f2b3a;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .flow-row:hover, .flow-row.active {
      background: #1a2a32;
      border-color: #00e5b4;
    }
    .flow-ch-num {
      color: #00e5b4;
      font-weight: 900;
      font-size: 16px;
      min-width: 40px;
    }
    .flow-logo-tile {
      width: 54px;
      height: 36px;
      border-radius: 6px;
      background: #0b1018;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
      flex-shrink: 0;
    }
    .flow-logo-tile img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .flow-row-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .flow-row-title {
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .flow-hd-tag {
      background: #1f3640;
      color: #00e5b4;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 3px;
    }
    .flow-epg-sub {
      font-size: 12px;
      color: #9eb0c2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .flow-prog-bar {
      width: 100%;
      height: 3px;
      background: #243242;
      border-radius: 2px;
      overflow: hidden;
    }
    .flow-prog-fill {
      height: 100%;
      background: #00e5b4;
    }
    .flow-play-circle {
      background: #1b2836;
      color: #00e5b4;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      flex-shrink: 0;
    }
    .flow-row:hover .flow-play-circle, .flow-row.active .flow-play-circle {
      background: #00e5b4;
      color: #041411;
    }
    .flow-preview-card {
      background: #131a24;
      border: 1px solid #223446;
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: sticky;
      top: 82px;
    }
    .flow-preview-screen {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      background: linear-gradient(135deg, #0b141e 0%, #132a2e 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }
    .flow-preview-screen img {
      max-width: 65%;
      max-height: 65%;
      object-fit: contain;
      position: relative;
      z-index: 1;
    }
    .flow-preview-screen video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-height: none;
      object-fit: contain;
      background: #000;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .flow-preview-screen video.playing {
      opacity: 1;
    }
    .flow-preview-mute {
      position: absolute;
      bottom: 8px;
      left: 8px;
      z-index: 4;
      background: rgba(10, 14, 20, 0.85);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .flow-preview-expand {
      position: absolute;
      bottom: 8px;
      right: 8px;
      z-index: 4;
      background: rgba(10, 14, 20, 0.82);
      color: #fff;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 700;
      pointer-events: none;
    }
    .epg-row-flex {
      display: flex;
      align-items: stretch;
      gap: 12px;
    }
    .epg-ch-col {
      width: 155px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }
    .flow-pill, .pill, .flow-badge, .flow-live-clock {
      white-space: nowrap;
    }
    .flow-btn-watch {
      background: #00e5b4;
      color: #041411;
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      width: 100%;
    }
    .flow-btn-watch:hover { filter: brightness(1.08); }

    @media (max-width: 599px) {
      .nav-rail { display: none; }
      .app-main { height: calc(100vh - 60px); padding-bottom: 12px; }
      .hero { height: 420px; min-height: 380px; padding: 92px 14px 20px; }
      .hero-top-bar { padding: 12px 14px; }
      .rows-container { padding: 8px 14px 24px; }
      .browser-page, .flow-page { padding: 12px 12px 24px; }
      .flow-split { grid-template-columns: 1fr; }
      .flow-preview-card { display: none; }
      .flow-guide-list { max-height: none; }
      .epg-row-flex { flex-direction: column; gap: 8px; }
      .epg-ch-col { width: 100%; flex-direction: row; align-items: center; gap: 8px; }
      .poster-card { flex: 0 0 116px; width: 116px; }
      .media-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
      .mobile-bottom-nav { display: flex; }
    }

    @media (max-height: 520px) and (min-width: 600px) {
      .nav-rail { width: 82px; padding: 6px 4px; }
      .rail-item { padding: 6px 2px; }
      .hero { height: auto; min-height: 265px; padding: 64px 16px 16px; }
      .flow-split { grid-template-columns: 1.15fr 0.95fr; gap: 12px; }
      .flow-preview-card {
        display: flex;
        padding: 10px;
        gap: 8px;
        max-height: calc(100vh - 150px);
        overflow-y: auto;
        top: 10px;
      }
      .flow-preview-screen {
        aspect-ratio: auto;
        height: 140px;
        flex-shrink: 0;
      }
      .flow-guide-list {
        max-height: calc(100vh - 150px);
      }
    }
    .live-drawer-backdrop {
      position: absolute;
      inset: 0;
      z-index: 35;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: stretch;
      justify-content: flex-start;
    }
    .live-drawer-backdrop.open { display: flex; }
    .live-drawer-col {
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .live-drawer-cats {
      width: 230px;
      background: rgba(13, 19, 30, 0.96);
      border-right: 1px solid #1f2d3d;
      padding: 12px 10px;
    }
    .live-drawer-chans {
      width: 340px;
      max-width: 86vw;
      background: rgba(10, 14, 20, 0.94);
      border-right: 2px solid #00e5b4;
      padding: 12px;
    }
    .live-drawer-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .live-drawer-title {
      color: #00e5b4;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .live-drawer-hint {
      color: #9eb0c2;
      font-size: 11px;
      margin-bottom: 8px;
    }
    .live-drawer-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
    }
    .live-drawer-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 8px;
      background: #131a24;
      border: 1px solid #1e2b3b;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }
    .live-drawer-item:hover { background: #1a2a36; border-color: #00e5b4; }
    .live-drawer-item.active { background: #163038; border-color: #00e5b4; }
    .live-drawer-item.focused { background: #00e5b4; color: #041411; border-color: #fff; font-weight: 800; }
    .live-drawer-item.focused .ld-sub { color: #082721; }
    .ld-num { color: #00e5b4; font-weight: 900; font-size: 12px; min-width: 30px; }
    .live-drawer-item.focused .ld-num { color: #041411; }
    .ld-sub { color: #8ea2b5; font-size: 11px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>

  <!-- Detail Modal -->
  <div class="modal-backdrop" id="detailModal" onclick="if(event.target===this)closeDetail()">
    <div class="detail-box" id="detailContent"></div>
  </div>

  <!-- Adult TV +18 Password Modal -->
  <div class="modal-backdrop" id="adultPinModal" onclick="if(event.target===this)closeAdultPinModal()">
    <div class="detail-box" style="max-width:420px;padding:24px;display:flex;flex-direction:column;gap:14px;">
      <div style="font-size:20px;font-weight:900;color:#fff;">🔒 Categoría TV +18 Protegida</div>

      <div id="adultPinErr" style="font-size:12px;color:#ff5c6c;font-weight:700;display:none;"></div>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:4px;">

      </div>

      // Never allow proxy URLs with credentials (user:pass@host) as API_BASE, and always use same-origin on Render/Node

    const NOW_MONTH_PREFIX = (() => {

    // Quality Preference & Parental Control (+18) Helpers
    const QUALITY_OPTIONS = ["auto", "2160", "1440", "1080", "720", "480"];
    function getPreferredQuality() {
      const q = (localStorage.getItem("mf_web_quality") || "auto").toLowerCase();
      return QUALITY_OPTIONS.includes(q) ? q : "auto";
    }
    function setPreferredQuality(q) {
      const clean = QUALITY_OPTIONS.includes(String(q)) ? String(q) : "auto";
      localStorage.setItem("mf_web_quality", clean);
      render();
    }
    function qualityLabel(q) {
      if (q === "2160") return "4K UHD (2160p)";
      if (q === "1440") return "2K QHD (1440p)";
      if (q === "1080") return "1080p Full HD";
      if (q === "720") return "720p HD";
      if (q === "480") return "480p SD";
      return "Automática";
    }
    function qualityShortLabel(q) {
      if (q === "2160") return "4K";
      if (q === "1440") return "2K";
      if (q === "1080") return "1080p";
      if (q === "720") return "720p";
      if (q === "480") return "480p";
      return "Auto";
    }
    const ENHANCE_OPTIONS = ["hd_plus", "ultra", "off"];
    function getVideoEnhanceMode() {
      const m = (localStorage.getItem("mf_web_enhance") || "hd_plus").toLowerCase();
      return ENHANCE_OPTIONS.includes(m) ? m : "hd_plus";
    }
    function setVideoEnhanceMode(mode) {
      const clean = ENHANCE_OPTIONS.includes(String(mode)) ? String(mode) : "hd_plus";
      localStorage.setItem("mf_web_enhance", clean);
      applyWebVideoEnhance();
      render();
    }
    function enhanceLabel(mode) {
      if (mode === "hd_plus") return "✨ Cine HD+ (Recomendado)";
      if (mode === "ultra") return "⚡ Ultra Nitidez (4K Sim)";
      return "Original (Desactivado)";
    }
    function enhanceShortLabel(mode) {
      if (mode === "hd_plus") return "✨ HD+";
      if (mode === "ultra") return "⚡ Ultra";
      return "Original";
    }
    function formatResolutionShort(h) {
      if (!h || h <= 0) return "";
      if (h >= 2000) return "4K";
      if (h >= 1400) return "2K";
      if (h >= 1000) return "1080p";
      if (h >= 700) return "720p";
      if (h >= 450) return "480p";
      return h + "p";
    }
    function applyWebVideoEnhance() {
      const video = document.getElementById("videoEl");
      const enhBadge = document.getElementById("playerEnhBadge");
      const enhBtn = document.getElementById("btnEnhanceMenu");
      const mode = activePlayer && activePlayer.isLive ? "off" : getVideoEnhanceMode();
      if (video) {
        video.classList.remove("mf-enhance-hd_plus", "mf-enhance-ultra", "mf-enhance-off");
        video.classList.add("mf-enhance-" + mode);
      }
      if (enhBadge) {
        if (!activePlayer || activePlayer.isLive || mode === "off") {
          enhBadge.style.display = "none";
        } else {
          enhBadge.textContent = enhanceShortLabel(mode);
          enhBadge.style.display = "inline-flex";
        }
      }
      if (enhBtn) {
        enhBtn.textContent = enhanceShortLabel(getVideoEnhanceMode());
        enhBtn.classList.toggle("active", getVideoEnhanceMode() !== "off");
      }
    }
    function cycleVideoEnhanceMode() {
      const cur = getVideoEnhanceMode();
      const idx = ENHANCE_OPTIONS.indexOf(cur);
      const next = ENHANCE_OPTIONS[(idx + 1) % ENHANCE_OPTIONS.length];
      localStorage.setItem("mf_web_enhance", next);
      applyWebVideoEnhance();
      showSeekToast(enhanceLabel(next));
      const panel = document.getElementById("trackPanel");
      if (panel && panel.classList.contains("open") && activePlayer.menuMode === "quality") {
        renderTrackPanel();
      }
    }
    function updateRealVideoResolutionBadge() {
      const video = document.getElementById("videoEl");
      const badge = document.getElementById("playerRealResBadge");
      const w = (video && video.videoWidth) || 0;
      const h = (video && video.videoHeight) || 0;
      activePlayer.realVideoWidth = w;
      activePlayer.realVideoHeight = h;
      if (badge) {
        if (h > 0) {
          const tag = formatResolutionShort(h);
          badge.textContent = w > 0 ? `${tag} • ${w}×${h}` : tag;
          badge.style.display = "inline-flex";
        } else {
          badge.style.display = "none";
        }
      }
      updateQualityButtonLabels();
    }

    function isAdultLockEnabled() {
      const raw = localStorage.getItem("mf_adult_lock_enabled");
      return raw === null ? true : raw === "1";
    }
    function getAdultPin() {
      return localStorage.getItem("mf_adult_pin") || "1234";
    }
    function isAdultLockedNow() {
      return isAdultLockEnabled() && !state.adultUnlocked;
    }
    function isAdultCategory(id, name) {
      const cid = String(id || "").trim();
      if (cid === "76208") return true;
      const n = String(name || "").trim().toLowerCase();
      if (!n || n.includes("adult swim")) return false;
      return /(?:^|[\s(\[])(?:18\+|\+18|adultos?|xxx|porno?|er[oó]tic[oa]s?|hot\s*\+?18)(?:$|[\s)\]])/i.test(n);
    }
    function isAdultChannel(ch) {
      if (!ch) return false;
      if (isAdultCategory("", ch.category)) return true;
      const t = String(ch.name || ch.title || "").trim().toLowerCase();
      if (!t || t.includes("adult swim") || t.includes("venus media")) return false;
      return /(?:^|\b)(?:xxx|porno?|playboy|penthouse|hustler|brazzers|sextreme|dorcel|private\s*tv|venus\s*tv|18\+|\+18)(?:\b|$)/i.test(t);
    }

    let pendingAdultCallback = null;
    function openAdultPinModal(onSuccess, customMsg) {
      pendingAdultCallback = onSuccess || null;
      const modal = document.getElementById("adultPinModal");
      const inp = document.getElementById("adultPinInput");
      const err = document.getElementById("adultPinErr");
      const msg = document.getElementById("adultPinPromptMsg");
      if (msg) msg.textContent = customMsg || "Ingresá tu contraseña de control parental para acceder a los canales +18.";
      if (err) { err.style.display = "none"; err.textContent = ""; }
      if (inp) inp.value = "";
      if (modal) modal.classList.add("open");
      setTimeout(() => { if (inp) inp.focus(); }, 60);
    }
    function closeAdultPinModal() {
      pendingAdultCallback = null;
      const modal = document.getElementById("adultPinModal");
      if (modal) modal.classList.remove("open");
    }
    function submitAdultPinModal() {
      const inp = document.getElementById("adultPinInput");
      const err = document.getElementById("adultPinErr");
      const entered = (inp ? inp.value : "").trim();
      if (entered !== getAdultPin()) {
        if (err) {
          err.textContent = "✗ Contraseña incorrecta. Probá nuevamente.";
          err.style.display = "block";
        }
        if (inp) { inp.value = ""; inp.focus(); }
        return;
      }
      const cb = pendingAdultCallback;
      closeAdultPinModal();
      if (cb) cb();
    }
    function selectLiveCategoryGuarded(colId, catName) {
      const cid = String(colId);
      if (isAdultCategory(cid, catName) && isAdultLockedNow()) {
        openAdultPinModal(() => {
          state.adultUnlocked = true;
          loadLiveCategory(cid);
        }, `Ingresá tu contraseña para abrir "${catName || "TV +18"}".`);
        return;
      }
      if (cid === "__FAVS__") {
        state.selectedLiveCat = "__FAVS__";
        render();
      } else {
        loadLiveCategory(cid);
      }
    }
    function lockAdultNow() {
      state.adultUnlocked = false;
      const curCat = (state.liveCategories || []).find(c => String(c.id) === String(state.selectedLiveCat));
      if (isAdultCategory(state.selectedLiveCat, curCat && curCat.name)) {
        stopLivePreview();
        loadLiveCategory("__ALL_MERGED__");
      } else {
        render();
      }
    }
    function toggleAdultLockFromSettings() {
      if (isAdultLockEnabled()) {
        openAdultPinModal(() => {
          localStorage.setItem("mf_adult_lock_enabled", "0");
          state.adultUnlocked = true;
          alert("Bloqueo de TV +18 desactivado.");
          render();
        }, "Ingresá tu contraseña actual para desactivar el bloqueo de TV +18.");
      } else {
        localStorage.setItem("mf_adult_lock_enabled", "1");
        state.adultUnlocked = false;
        alert("Bloqueo de TV +18 activado.");
        render();
      }
    }
    function saveAdultPinFromSettings() {
      const curInp = document.getElementById("inpAdultPinCurrent");
      const newInp = document.getElementById("inpAdultPinNew");
      const curVal = (curInp ? curInp.value : "").trim();
      const newVal = (newInp ? newInp.value : "").trim();
      if (curVal !== getAdultPin()) {
        return alert("✗ La contraseña actual no coincide.");
      }
      if (newVal.length < 4) {
        return alert("✗ La nueva contraseña debe tener al menos 4 caracteres o dígitos.");
      }
      localStorage.setItem("mf_adult_pin", newVal);
      localStorage.setItem("mf_adult_lock_enabled", "1");
      state.adultUnlocked = false;
      if (curInp) curInp.value = "";
      if (newInp) newInp.value = "";
      alert("✓ Contraseña de TV +18 actualizada y bloqueo activado.");
      render();
    }

    function normalizeItem(raw, defaultKind) {
      if (!raw || !raw.id) return null;
      const isSer = raw.kind === "serie" || raw.kind === "series" || raw.type === "teleplay" || defaultKind === "series";
      const rawGenres = Array.isArray(raw.genres) ? raw.genres : [];
      const genres = [];
      rawGenres.forEach(g => {
        const clean = GENRE_MAP[String(g || "").trim().toLowerCase()] || String(g || "").trim();
        if (clean && !genres.includes(clean)) genres.push(clean);
      });
      if (raw.row && !/^(all|\d+)$/i.test(raw.row)) {
        const mappedRow = GENRE_MAP[String(raw.row).trim().toLowerCase()] || String(raw.row).trim();
        if (mappedRow && !genres.includes(mappedRow)) genres.push(mappedRow);
      }
      let relDate = String(raw.releaseDate || raw.releaseTime || "").trim();
      let yr = String(raw.year || "").trim();
      if (/^\d{4}/.test(relDate)) yr = relDate.slice(0, 4);
      if (!/^\d{4}$/.test(yr)) {
        const m = String((raw.title || "") + " " + (raw.row || "") + " " + relDate).match(/\b(19[7-9]\d|20[0-2]\d)\b/);
        yr = m ? m[1] : "";
      }
      if (!relDate && yr) relDate = yr + "-01-01";
      return {
        id: String(raw.id),
        title: String(raw.title || raw.name || "Título"),
        kind: isSer ? "series" : "movie",
        year: yr,
        releaseDate: relDate,
        score: (raw.score && raw.score !== "—" && raw.score !== "0") ? String(raw.score) : "8.4",
        duration: String(raw.duration || ""),
        genres: genres.length ? genres : ["Destacado"],
        synopsis: String(raw.synopsis || raw.description || ""),
        poster: String(raw.poster || raw.backdrop || ""),
        backdrop: String(raw.backdrop || raw.landscape || raw.poster || ""),
        row: String(raw.row || "")
      };
    }

    // LocalStorage Helpers for Favorites & Watch Progress
    function getFavorites() {
      try { return JSON.parse(localStorage.getItem("mf_web_favs") || "[]"); } catch (_) { return []; }
    }
    function isFavorite(id) {
      return getFavorites().some(x => x.id === id);
    }
    function toggleFavorite(item) {
      const list = getFavorites();
      const idx = list.findIndex(x => x.id === item.id);
      if (idx >= 0) list.splice(idx, 1);
      else list.unshift(item);
      localStorage.setItem("mf_web_favs", JSON.stringify(list.slice(0, 200)));
      render();
    }

    function getProgressMap() {
      try { return JSON.parse(localStorage.getItem("mf_web_progress") || "{}"); } catch (_) { return {}; }
    }
    function getProgress(id) {
      return getProgressMap()[id] || null;
    }
    function saveProgress(playId, posSec, durSec, title, itemObj) {
      if (!posSec || posSec < 3) return;
      const map = getProgressMap();
      const effPos = (durSec > 60 && posSec >= durSec - 25) ? 0 : Math.floor(posSec);
      const entry = {
        id: playId,
        posSec: effPos,
        durSec: Math.floor(durSec || 0),
        title: title || "",
        item: itemObj || (map[playId] && map[playId].item) || null,
        updatedAt: Date.now()
      };
      map[playId] = entry;
      if (playId.includes(":")) {
        const seriesId = playId.split(":")[1];
        if (seriesId) {
          map[seriesId] = Object.assign({}, entry, { id: seriesId, episodeId: playId });
        }
      }
      localStorage.setItem("mf_web_progress", JSON.stringify(map));
    }
    function clearProgress(id) {
      const map = getProgressMap();
      delete map[id];
      Object.keys(map).forEach(k => { if (k.endsWith(":" + id)) delete map[k]; });
      localStorage.setItem("mf_web_progress", JSON.stringify(map));
    }
    function formatSec(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      const pad = n => (n < 10 ? "0" + n : "" + n);
      return h > 0 ? `${h}:${pad(m)}:${pad(r)}` : `${pad(m)}:${pad(r)}`;
    }

    async function parseJsonSafe(res) {
      const txt = await res.text();
      if (/^\s*</.test(txt)) {
        throw new Error("El servidor devolvió HTML en lugar de API JSON. Asegurate de tener corriendo server.js (Iniciar_Marianflix_Web.bat) y configurada su URL en Ajustes.");
      }
      let data = {};
      try { data = JSON.parse(txt || "{}"); } catch (_) {
        throw new Error("Respuesta no válida del servidor.");
      }
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
      return data;
    }

    async function apiGet(path, timeoutMs = 8000) {
      const url = path.startsWith("http") ? path : (API_BASE + path);
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(url, { signal: ctrl.signal });
        return await parseJsonSafe(res);
      } catch (e) {
        if (e && e.name === "AbortError") throw new Error("Tiempo de espera agotado conectando al servidor");
        throw e;
      } finally {
        clearTimeout(t);
      }
    }

    async function apiPost(path, bodyObj, timeoutMs = 12000) {
      const url = path.startsWith("http") ? path : (API_BASE + path);
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(bodyObj || {}),
          signal: ctrl.signal
        });
        return await parseJsonSafe(res);
      } catch (e) {
        if (e && e.name === "AbortError") throw new Error("Tiempo de espera agotado conectando al servidor");
        throw e;
      } finally {
        clearTimeout(t);
      }
    }

    async function initCatalog() {
      state.featured = (SNAP.featured || []).map(x => normalizeItem(x, "movie")).filter(Boolean);
      state.movies = (SNAP.movies || []).map(x => normalizeItem(x, "movie")).filter(Boolean);
      state.series = (SNAP.series || []).map(x => normalizeItem(x, "series")).filter(Boolean);
      state.liveCategories = [
        { id: "__ALL_MERGED__", name: "Todos (Fusión)" },
        { id: "__ARGENTINA__", name: "Argentina" },
        { id: "__MARIANTV__", name: "MarianTV+ (Directo)" },
        ...(SNAP.liveCategories || [])
          .filter(c => String(c.id) !== "76182")
          .map(c => ({ id: String(c.id), name: c.name === "ChannelList" ? "Portal Todos" : c.name }))
      ];
      state.liveChannels = SNAP.liveChannels || [];
      state.allLiveChannels = [...state.liveChannels];
      render();

      // Load static live_channels.json (3,537 Mariantv_plus channels) so GitHub Pages & offline mode always have Argentina, Deportes, etc.
      fetch("live_channels.json").then(r => r.ok ? r.json() : null).then(arr => {
        if (Array.isArray(arr) && arr.length) {
          const normalized = arr.filter(c => c && c.id && c.streamUrl).map((c, idx) => ({
            channelCode: String(c.id),
            id: String(c.id),
            index: c.channelNumber || (101 + idx),
            number: c.channelNumber || (101 + idx),
            name: String(c.title || ("Canal " + (101 + idx))),
            title: String(c.title || ("Canal " + (101 + idx))),
            category: String(c.category || "Argentina"),
            logo: String(c.posterUrl || ""),
            poster: String(c.posterUrl || ""),
            streamUrl: String(c.streamUrl || "")
          }));
          const seen = new Set(normalized.map(x => x.channelCode));
          const merged = [...normalized];
          (SNAP.liveChannels || []).forEach(p => {
            const code = String(p.channelCode || p.id || "");
            if (code && !seen.has(code)) { seen.add(code); merged.push(p); }
          });
          state.allLiveChannels = merged;
          if (!state.liveLoadedFromApi) {
            state.liveChannels = filterLiveLocal(state.selectedLiveCat, merged);
            render();
          }
        }
      }).catch(() => {});

      // Fire each endpoint independently so fast TV/Argentina updates render IMMEDIATELY without waiting for VOD!
      apiGet("/api/live-categories", 5000).then(cRes => {
        if (cRes && cRes.categories && cRes.categories.length) {
          const mergedCats = [];
          const seenIds = new Set();
          [...cRes.categories, ...state.liveCategories].forEach(c => {
            const cid = String(c.id);
            if (!seenIds.has(cid)) {
              seenIds.add(cid);
              mergedCats.push({ id: cid, name: c.name === "ChannelList" ? "Todos" : c.name });
            }
          });
          state.liveCategories = mergedCats;
          render();
        }
      }).catch(() => {});

      apiGet("/api/live-channels?columnId=__ALL_MERGED__", 6000).then(chRes => {
        if (chRes && Array.isArray(chRes.channels) && chRes.channels.length) {
          state.allLiveChannels = chRes.channels;
          state.liveChannels = filterLiveLocal(state.selectedLiveCat, chRes.channels);
          state.liveLoadedFromApi = true;
          render();
        }
      }).catch(() => {});

      apiGet("/api/home?root=featured", 10000).then(fRes => {
        if (fRes && fRes.items && fRes.items.length) {
          state.featured = fRes.items.map(x => normalizeItem(x, "movie")).filter(Boolean);
          render();
        }
      }).catch(() => {});

      apiGet("/api/home?root=movies", 12000).then(mRes => {
        if (mRes && mRes.items && mRes.items.length) {
          state.movies = mRes.items.map(x => normalizeItem(x, "movie")).filter(Boolean);
          render();
        }
      }).catch(() => {});

      apiGet("/api/home?root=series", 12000).then(sRes => {
        if (sRes && sRes.items && sRes.items.length) {
          state.series = sRes.items.map(x => normalizeItem(x, "series")).filter(Boolean);
          render();
        }
      }).catch(() => {});

      apiGet("/api/session-status", 4000).then(st => {
        if (st) {
          state.sessionStatus = st;
          if (st.customM3uUrl) state.customM3uUrl = st.customM3uUrl;
          if (state.section === "settings") render();
        }
      }).catch(() => {});

      apiGet("/api/custom-vod", 4000).then(cv => {
        if (cv && Array.isArray(cv.items)) {
          state.customVod = cv.items;
          state.customM3uUrl = cv.m3uUrl || "";
          render();
        }
      }).catch(() => {});
    }

    setInterval(() => {
      if (state.section === "home") {
        state.heroIndex = (state.heroIndex + 1) % 5;
        render();
      }
    }, 8000);

    function switchSection(sec) {
      state.section = sec;
      state.selectedCategory = "Todas";
      state.selectedYear = "Todos";
      document.querySelectorAll(".rail-item, .mob-tab").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.sec === sec);
      });
      const mainEl = document.getElementById("appRoot");
      if (mainEl) mainEl.scrollTop = 0;
      if (sec === "live" && (!state.liveLoadedFromApi || state.liveChannels.length === 0)) {
        loadLiveCategory(state.selectedLiveCat);
      }
      render();
      if (sec === "search") {
        setTimeout(() => {
          const inp = document.getElementById("searchScreenInput");
          if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
        }, 40);
      }
    }

    function filterLiveLocal(colId, pool) {
      const list = Array.isArray(pool) ? pool : state.allLiveChannels;
      const cid = String(colId || "__ALL_MERGED__");
      if (cid === "__ALL_MERGED__" || cid === "__MARIANTV__" || cid === "76182") return list;
      if (cid === "__ARGENTINA__") {
        return list.filter(c => /argentina/i.test(String(c.category || "")) || /\b(telefe|el trece|eltrece|tn|c5n|a24|cronica|crónica|américa tv|america tv|canal 9|tv pública|tyc|net tv|canal 26)\b/i.test(String(c.name || c.title || "")));
      }
      if (cid.startsWith("__LOCAL_CAT__:")) {
        const target = cid.slice("__LOCAL_CAT__:".length).toLowerCase();
        return list.filter(c => String(c.category || "").toLowerCase() === target);
      }
      const catObj = (state.liveCategories || []).find(x => String(x.id) === cid);
      const catName = catObj ? String(catObj.name || "").replace(/\s*\(Portal\)$/i, "").trim().toLowerCase() : "";
      if (catName) {
        const byCat = list.filter(c => String(c.category || "").toLowerCase().includes(catName) || String(c.name || c.title || "").toLowerCase().includes(catName));
        if (byCat.length) return byCat;
      }
      return list;
    }

    async function loadLiveCategory(colId) {
      const cid = String(colId);
      state.selectedLiveCat = cid;
      state.selectedLiveSubCat = "Todas";
      // Immediately update visible channels from local pool (works offline & on GitHub Pages!)
      if (state.allLiveChannels.length) {
        state.liveChannels = filterLiveLocal(cid, state.allLiveChannels);
      }
      render();
      try {
        const data = await apiGet(`/api/live-channels?columnId=${encodeURIComponent(cid)}`, 5000);
        if (data && Array.isArray(data.channels) && data.channels.length && state.selectedLiveCat === cid) {
          state.liveChannels = data.channels;
          state.liveLoadedFromApi = true;
          render();
        }
      } catch (_) {}
    }

    let searchTimer = null;
    let searchSeq = 0;
    function setSearchKindFilter(k) {
      state.searchKindFilter = k || "all";
      render();
    }
    function renderKeepSearchFocus(fromInputEl) {
      const wasScreenInput = fromInputEl === "searchScreenInput" || (document.activeElement && document.activeElement.id === "searchScreenInput");
      const selPos = (document.activeElement && document.activeElement.id === "searchScreenInput")
        ? document.activeElement.selectionStart
        : null;
      render();
      if (wasScreenInput) {
        const inp = document.getElementById("searchScreenInput");
        if (inp) {
          inp.focus();
          const pos = typeof selPos === "number" ? selPos : inp.value.length;
          try { inp.setSelectionRange(pos, pos); } catch (_) {}
        }
      }
    }
    function onGlobalSearch(val) {
      const fromId = document.activeElement ? document.activeElement.id : "";
      state.searchQuery = val;
      const trimmed = val.trim();
      const mySeq = ++searchSeq;
      clearTimeout(searchTimer);
      if (!trimmed) {
        state.searchLoading = false;
        state.searchResults = [];
        if (state.section === "search" && fromId !== "searchScreenInput") state.section = "home";
        renderKeepSearchFocus(fromId);
        return;
      }
      state.section = "search";
      state.searchLoading = true;
      const q = trimmed.toLowerCase();
      const normQ = q.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "");
      const localPool = [...state.featured, ...state.movies, ...state.series];
      const seen = new Set();
      state.searchResults = localPool.filter(item => {
        if (seen.has(item.id)) return false;
        const normT = item.title.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "");
        const match = item.title.toLowerCase().includes(q) ||
          (normQ.length >= 2 && normT.includes(normQ)) ||
          item.year.includes(q) ||
          item.genres.some(g => g.toLowerCase().includes(q));
        if (match) { seen.add(item.id); return true; }
        return false;
      });
      renderKeepSearchFocus(fromId);

      searchTimer = setTimeout(async () => {
        try {
          const data = await apiGet(`/api/search?q=${encodeURIComponent(trimmed)}`);
          if (mySeq !== searchSeq) return;
          if (data && Array.isArray(data.items)) {
            const remote = data.items.map(x => normalizeItem(x)).filter(Boolean);
            const merged = [...remote];
            const idSet = new Set(merged.map(m => m.id));
            state.searchResults.forEach(localIt => {
              if (localIt && !idSet.has(localIt.id)) {
                idSet.add(localIt.id);
                merged.push(localIt);
              }
            });
            state.searchResults = merged;
          }
        } catch (_) {
        } finally {
          if (mySeq === searchSeq) {
            state.searchLoading = false;
            renderKeepSearchFocus();
          }
        }
      }, 380);
    }

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function renderPosterCard(item, opts = {}) {
      const rankHtml = opts.rank
        ? `<div class="rank-ribbon"><small>TOP</small><strong>${opts.rank}</strong></div>`
        : `<div class="card-badge-m">
             <span class="mini-m">M</span>
             ${item.year ? `<span class="mini-year">${escapeHtml(item.year)}</span>` : ""}
           </div>`;
      const scoreHtml = item.score
        ? `<span class="mini-score">★ ${escapeHtml(item.score)}</span>`
        : "";
      const progHtml = opts.progressRatio
        ? `<div class="card-progress-bar"><div class="card-progress-fill" style="width:${Math.round(opts.progressRatio * 100)}%"></div></div>`
        : "";
      const subText = opts.progressLabel || (item.genres && item.genres[0]) || "";

      return `
        <div class="poster-card" tabindex="0" onclick="openDetail('${escapeHtml(item.id)}')">
          <div class="poster-wrap">
            <img class="poster-img" loading="lazy" src="${escapeHtml(item.poster)}" alt="${escapeHtml(item.title)}" onerror="this.style.opacity=0.2" />
            ${rankHtml}
            ${scoreHtml}
            ${progHtml}
          </div>
          <div class="poster-title">${escapeHtml(item.title)}</div>
          <div class="poster-sub" style="${opts.progressLabel ? 'color:#ff525b;font-weight:700;' : ''}">${escapeHtml(subText)}</div>
        </div>
      `;
    }

    function onClickDisneyHub(hubId) {
      if (hubId === "live") {
        setSection("live");
        return;
      }
      state.homeFilter = (state.homeFilter === hubId && hubId !== "all") ? "all" : hubId;
      render();

    function renderHome() {
      let pool = [];
      if (state.homeFilter === "series") pool = [...state.series];
      else if (state.homeFilter === "movies") pool = [...state.movies];
      else if (state.homeFilter === "favs") pool = getFavorites();
      else if (String(state.homeFilter || "").startsWith("genre:")) {
        const gTarget = state.homeFilter.slice(6).toLowerCase();
        pool = [...state.featured, ...state.movies, ...state.series].filter(it =>
          (it.genres || []).some(g => g.toLowerCase() === gTarget) ||
          String(it.row || "").toLowerCase().includes(gTarget)
        );
      }
      else pool = [...state.featured, ...state.movies, ...state.series];

      const unique = [];
      const seen = new Set();
      pool.forEach(it => { if (it && !seen.has(it.id)) { seen.add(it.id); unique.push(it); } });

      const byNewest = [...unique].sort((a, b) => String(b.releaseDate || b.year || "").localeCompare(String(a.releaseDate || a.year || "")));
      const thisMonthItems = byNewest.filter(x => String(x.releaseDate || "").startsWith(NOW_MONTH_PREFIX));
      const heroes = (thisMonthItems.length >= 3 ? thisMonthItems : byNewest)
        .filter(x => x.backdrop || x.poster)
        .slice(0, 5);
      const hero = heroes[state.heroIndex % Math.max(1, heroes.length)] || unique[0];

      // Continuar viendo
      const progMap = getProgressMap();
      const continueList = Object.values(progMap)
        .filter(p => p && p.posSec > 3 && !String(p.id).includes(":"))
        .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))
        .slice(0, 15);

      const top10 = [...unique]
        .sort((a, b) => (parseFloat(b.score) || 0) - (parseFloat(a.score) || 0))
        .slice(0, 10);

      const shelves = [];
      if (state.customVod && state.customVod.length) {
        shelves.push(["📂 Mi Lista VOD Propia (Respaldo Activo)", state.customVod.slice(0, 30)]);
      }
      if (thisMonthItems.length) {
        shelves.push(["🔥 Estrenos del mes", thisMonthItems.slice(0, 26)]);
      }
      if (state.homeFilter === "all") {
        if (state.movies.length) shelves.push(["Películas de estreno (2026)", [...state.movies].sort((a,b)=>String(b.releaseDate||b.year||"").localeCompare(String(a.releaseDate||a.year||""))).slice(0, 26)]);
        if (state.series.length) shelves.push(["Series de estreno (2026)", [...state.series].sort((a,b)=>String(b.releaseDate||b.year||"").localeCompare(String(a.releaseDate||a.year||""))).slice(0, 26)]);
        if (state.featured.length) shelves.push(["Tendencias ahora", state.featured.slice(0, 24)]);
      } else {
        shelves.push(["Estrenos recientes", byNewest.slice(0, 26)]);
      }

      const genreShelves = [
        ["Acción", "Acción y adrenalina"],
        ["Comedia", "Comedias para disfrutar"],
        ["Drama", "Dramas imprescindibles"],
        ["Terror", "Terror y misterio"],
        ["Ciencia ficción", "Ciencia ficción y mundos futuros"],
        ["Suspenso", "Thrillers de alto suspenso"],
        ["Aventura", "Grandes aventuras"],
        ["Familia", "Para ver en familia"],
        ["Romance", "Historias de romance"]
      ];
      genreShelves.forEach(([g, title]) => {
        const list = unique.filter(x => x.genres.some(gx => gx.toLowerCase() === g.toLowerCase())).slice(0, 22);
        if (list.length >= 3) shelves.push([title, list]);
      });

      const heroHtml = hero ? `
        <section class="hero" style="background-image:url('${escapeHtml(hero.backdrop || hero.poster)}')">
          <div class="hero-top-bar">
            <div class="brand" onclick="state.homeFilter='all';render();">
              <span class="brand-m">M</span>
              <span class="brand-text">MARIANFLIX</span>
            </div>
            <div class="hero-quick-pills">
              <button class="pill ${state.homeFilter==='all'?'active':''}" onclick="state.homeFilter='all';render();">Inicio</button>
              <button class="pill ${state.homeFilter==='series'?'active':''}" onclick="state.homeFilter='series';render();">Series</button>
              <button class="pill ${state.homeFilter==='movies'?'active':''}" onclick="state.homeFilter='movies';render();">Películas</button>
              <button class="pill ${state.homeFilter==='favs'?'active':''}" onclick="state.homeFilter='favs';render();">Mi Lista ★</button>
            </div>
          </div>
          <div class="hero-content">
            <div class="hero-top-badge">
              <span class="top10-pill">TOP 10</span>
              <span>N.º ${(state.heroIndex % Math.max(1, heroes.length)) + 1} en ${hero.kind === "series" ? "Series" : "Películas"} hoy</span>
            </div>
            <h1 class="hero-title">${escapeHtml(hero.title)}</h1>
            <div class="hero-meta">
              <span class="match-text">98% para ti</span>
              <span>${escapeHtml(hero.year)}</span>
              <span class="hd-badge">HD</span>
              <span class="score-text">★ ${escapeHtml(hero.score)}</span>
              <span>${hero.kind === "series" ? "Serie" : "Película"}</span>
            </div>
            <div class="hero-genres">${hero.genres.slice(0, 4).map(escapeHtml).join("  •  ")}</div>
            <p class="hero-synopsis">${escapeHtml(hero.synopsis || "Disfrutá de este título destacado en Marianflix con opción de idioma de audio y subtítulos.")}</p>
            <div class="hero-actions">
              <button class="btn-play-netflix" onclick="playDirectly('${escapeHtml(hero.id)}')">▶ Reproducir</button>
              <button class="btn-info-netflix" onclick="openDetail('${escapeHtml(hero.id)}')">ⓘ Más info</button>

        <div>

            ${continueList.map(p => {
              const item = unique.find(x => x.id === p.id) || p.item || { id: p.id, title: p.title || p.id, poster: "", year: "", score: "" };
              const ratio = p.durSec > 0 ? Math.min(0.96, Math.max(0.05, p.posSec / p.durSec)) : 0.35;
              return renderPosterCard(item, {

            return `

        ${hubsHtml}

          ${continueHtml}
          ${top10Html}
          ${shelvesHtml}
        </div>
      `;

    function renderCatalogGrid(title, baseList, kind) {
      const dynamicCats = new Set(STANDARD_CATEGORIES);
      baseList.forEach(it => (it.genres || []).forEach(g => { if (g && !/^\d+$/.test(g)) dynamicCats.add(g); }));
      const categories = Array.from(dynamicCats);

      const filtered = baseList.filter(it => {
        const catOk = state.selectedCategory === "Todas" ||
          it.genres.some(g => g.toLowerCase() === state.selectedCategory.toLowerCase()) ||
          it.row.toLowerCase().includes(state.selectedCategory.toLowerCase());
        const yr = parseInt(it.year, 10) || 0;
        const yearOk = state.selectedYear === "Todos"
          ? true
          : state.selectedYear === "Este mes"
            ? String(it.releaseDate || "").startsWith(NOW_MONTH_PREFIX)
            : state.selectedYear === "Anteriores"
              ? (yr > 0 && yr < 2018)
              : (it.year === state.selectedYear || it.title.includes(state.selectedYear));
        return catOk && yearOk;
      }).sort((a, b) => {
        if (state.sortBy === "score") return (parseFloat(b.score) || 0) - (parseFloat(a.score) || 0);
        if (state.sortBy === "az") return a.title.localeCompare(b.title);
        return String(b.releaseDate || b.year || "").localeCompare(String(a.releaseDate || a.year || ""));
      });

      const showLoadMore = kind === "movie" || kind === "series";

      return `
        <div class="browser-page">
          <div class="page-header">
            <h1 class="page-title">${escapeHtml(title)} (${filtered.length})</h1>
            <div style="display:flex;gap:8px;">
              <button class="pill ${state.sortBy==='year'?'active':''}" onclick="state.sortBy='year';render()">Año ↓</button>
              <button class="pill ${state.sortBy==='score'?'active':''}" onclick="state.sortBy='score';render()">★ Top</button>
              <button class="pill ${state.sortBy==='az'?'active':''}" onclick="state.sortBy='az';render()">A-Z</button>
            </div>
          </div>

    async function loadShelveIntoCatalog(kind, category, year, page) {
      const apiKind = kind === "series" ? "series" : "movies";
      state.loadingMore = true;
      render();
      try {
        const data = await apiGet(`/api/shelve?kind=${apiKind}&category=${encodeURIComponent(category)}&year=${encodeURIComponent(year)}&page=${page}`);
        if (data && data.items) mergeIntoCatalog(data.items, kind);
      } catch (_) {}
      state.loadingMore = false;
      render();
    }

    async function loadMoreCatalog(kind) {
      state.catalogPage += 1;
      await loadShelveIntoCatalog(kind, state.selectedCategory, state.selectedYear, state.catalogPage);
    }

    async function selectCategoryFilter(cat, kind) {
      state.selectedCategory = cat;
      state.catalogPage = 1;
      render();
      if (kind === "movie" || kind === "series") {
        await loadShelveIntoCatalog(kind, cat, state.selectedYear, 1);
      }
    }

    async function selectYearFilter(yr, kind) {
      state.selectedYear = yr;
      state.catalogPage = 1;
      render();
      if (kind === "movie" || kind === "series") {
        await loadShelveIntoCatalog(kind, state.selectedCategory, yr, 1);
        if (yr !== "Todos" && yr !== "2026" && yr !== "Anteriores") {
          try {
            const data = await apiGet(`/api/search?q=${encodeURIComponent(yr)}`);
            if (data && data.items) mergeIntoCatalog(data.items, kind, yr);
          } catch (_) {}
        }
      }
    }

    function mergeIntoCatalog(rawItems, kind, forcedYear) {
      rawItems.forEach(raw => {
        const norm = normalizeItem(raw, kind === "series" ? "series" : "movie");
        if (!norm) return;
        if (forcedYear && (!norm.year || norm.year === "2025")) norm.year = forcedYear;
        if (norm.kind === "series") {
          const idx = state.series.findIndex(x => x.id === norm.id);
          if (idx >= 0) state.series[idx] = norm; else state.series.push(norm);
        } else {
          const idx = state.movies.findIndex(x => x.id === norm.id);
          if (idx >= 0) state.movies[idx] = norm; else state.movies.push(norm);
        }
      });
      render();
    }

    function getWebEpgSchedule(ch, count = 3) {
      const name = String((ch && (ch.name || ch.title)) || "");
      const cat = String((ch && ch.category) || "");
      const num = Number((ch && (ch.index || ch.number)) || 1);
      const txt = (cat + " " + name).toLowerCase();
      let pool = [
        ["Magazine en Vivo", "Actualidad, espectáculos, invitados y entretenimiento."],
        ["Prime Time Show", "El programa central de la noche en vivo."],
        ["Ficción y Entretenimiento", "Contenido destacado de la programación diaria."],
        ["Cultura y Sociedad", "Historias, documentales y entrevistas en profundidad."],
        ["Late Night en Vivo", "Humor, música e invitados especiales."]
      ];
      if (/notic|news|26|tn\b|c5n|dw/.test(txt)) {
        pool = [
          ["Edición Central de Noticias", "Resumen informativo con móviles en vivo y análisis."],
          ["Panorama Internacional", "Cobertura global de actualidad, economía y política."],
          ["Debate Abierto", "Mesa de periodistas y especialistas analizando el día."],
          ["Última Hora 24", "Flash informativo continuo y estado del tránsito."]
        ];
      } else if (/deport|sport|tyc|espn|fox|win/.test(txt)) {
        pool = [
          ["Fútbol en Vivo: Especial Jornada", "Transmisión en directo, previas y análisis táctico."],
          ["SportsCenter / Resumen", "Goles, estadísticas y lo mejor del deporte mundial."],
          ["Mesa Deportiva", "Debate, entrevistas y actualidad de las ligas."],
          ["Automovilismo y Motor", "Clasificaciones, carreras y cobertura en pista."]
        ];
      } else if (/cine|movie|film|serie|hbo|amc/.test(txt)) {
        pool = [
          ["Estreno de Cine: Acción Total", "Largometraje en alta definición sin cortes."],
          ["Noche de Suspenso", "Thriller cinematográfico seleccionado."],
          ["Cine Clásico Restaurado", "Película destacada en calidad digital."],
          ["Maratón de Series", "Episodios continuados de drama y misterio."]
        ];
      } else if (/kid|infantil|cartoon|disney|anim/.test(txt)) {
        pool = [
          ["Aventuras Animadas", "Episodios divertidos para los más chicos."],
          ["Mundo Kids", "Series educativas, música y juegos."],
          ["Súper Héroes Junior", "Capítulo estreno de animación."]
        ];
      } else if (/music|músic|mtv|htv/.test(txt)) {
        pool = [
          ["Top Hits 24/7", "Los videos musicales más escuchados del momento."],
          ["Sesiones en Vivo", "Recitales y acústicos exclusivos."],
          ["Clásicos del Rock & Pop", "Éxitos inolvidables de todas las décadas."]
        ];
      }
      const nowMs = Date.now();
      const slotMs = (num % 2 === 0) ? 3600000 : 1800000;
      const base = Math.floor(nowMs / slotMs) * slotMs;
      const pad2 = n => (n < 10 ? "0" + n : "" + n);
      const fmt = ms => { const d = new Date(ms); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
      const out = [];
      for (let i = 0; i < count; i++) {
        const start = base + i * slotMs;
        const end = start + slotMs;
        const idx = Math.abs(Math.floor(start / slotMs) + num * 7) % pool.length;
        const pct = Math.max(5, Math.min(98, Math.round(((nowMs - start) / slotMs) * 100)));
        out.push({ title: pool[idx][0], desc: pool[idx][1], range: `${fmt(start)} - ${fmt(end)}`, pct });
      }
      return out;
    }

    let previewHls = null;
    let previewTimer = null;
    let previewActiveCode = "";
    let previewMuted = true;

    function stopLivePreview() {
      if (previewTimer) { clearTimeout(previewTimer); previewTimer = null; }
      previewActiveCode = "";
      if (previewHls) {
        try { previewHls.destroy(); } catch (_) {}
        previewHls = null;
      }
      const pv = document.getElementById("previewVideoEl");
      if (pv) {
        try { pv.pause(); pv.removeAttribute("src"); pv.load(); } catch (_) {}
        pv.classList.remove("playing");
      }
    }

    function togglePreviewMute(ev) {
      if (ev) ev.stopPropagation();
      previewMuted = !previewMuted;
      const pv = document.getElementById("previewVideoEl");
      if (pv) pv.muted = previewMuted;
      const btn = document.getElementById("previewMuteBtn");
      if (btn) btn.textContent = previewMuted ? "🔇 Sonido" : "🔊 Sonido";
    }

    function scheduleLivePreview(code) {
      if (!code || state.section !== "live" || state.liveTab !== 0) {
        stopLivePreview();
        return;
      }
      if (window.innerWidth < 600) {
        stopLivePreview();
        return;
      }
      if (previewTimer) clearTimeout(previewTimer);
      previewTimer = setTimeout(() => startLivePreview(code), 380);
    }

    async function startLivePreview(code) {
      if (!code || state.section !== "live" || state.liveTab !== 0) return;
      const modal = document.getElementById("playerModal");
      if (modal && modal.classList.contains("open")) return;
      const pv = document.getElementById("previewVideoEl");
      if (!pv) return;
      if (previewActiveCode === code && previewHls) return;

      stopLivePreview();
      previewActiveCode = code;

      try {
        const chObj = state.liveChannels.find(c => String(c.channelCode || c.id) === String(code));
        let streamUrl = "";
        if (chObj && chObj.streamUrl && /^https?:\/\//i.test(chObj.streamUrl)) {
          streamUrl = chObj.streamUrl;
        } else {
          const data = await apiGet(`/api/resolve-live?code=${encodeURIComponent(code)}`);
          if (previewActiveCode !== code) return;
          streamUrl = data.streamUrl ? (data.streamUrl.startsWith("http") ? data.streamUrl : (API_BASE + data.streamUrl)) : (data.proxyUrl || "");
        }
        if (!streamUrl || previewActiveCode !== code) return;

        const videoEl = document.getElementById("previewVideoEl");
        if (!videoEl) return;
        videoEl.muted = previewMuted;
        videoEl.playsInline = true;
        videoEl.onplaying = () => videoEl.classList.add("playing");

        if (window.Hls && Hls.isSupported()) {
          previewHls = new Hls({ maxBufferLength: 10, maxMaxBufferLength: 20, enableWorker: true });
          previewHls.loadSource(streamUrl);
          previewHls.attachMedia(videoEl);
          previewHls.on(Hls.Events.MANIFEST_PARSED, () => {
            videoEl.play().catch(() => {});
          });
          previewHls.on(Hls.Events.ERROR, (_, errData) => {
            if (errData && errData.fatal) {
              try { previewHls.destroy(); } catch (_) {}
              previewHls = null;
              videoEl.classList.remove("playing");
            }
          });
        } else if (videoEl.canPlayType("application/vnd.apple.mpegurl")) {
          videoEl.src = streamUrl;
          videoEl.play().catch(() => {});
        }
      } catch (_) {}
    }

    function renderSearch() {
      const q = state.searchQuery || "";
      const kindFilter = state.searchKindFilter || "all";
      const list = q.trim() ? state.searchResults : [...state.featured, ...state.movies.slice(0, 18), ...state.series.slice(0, 18)];
      const unique = [];
      const seen = new Set();
      list.forEach(it => {
        if (!it || seen.has(it.id)) return;
        if (kindFilter === "movie" && it.kind === "series") return;
        if (kindFilter === "series" && it.kind !== "series") return;
        seen.add(it.id);
        unique.push(it);
      });

      const statusText = q.trim()
        ? (state.searchLoading
            ? `Buscando "${escapeHtml(q.trim())}" en el portal... (${unique.length} hasta ahora)`
            : `Resultados para "${escapeHtml(q.trim())}" (${unique.length})`)
        : `Sugerencias populares (${unique.length})`;

      return `
