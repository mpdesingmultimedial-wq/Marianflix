<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Marianflix • Películas, Series y TV en Vivo</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
  <script src="catalog-fallback.js"></script>
  <style>
    :root {
      --bg: #0b0b0f;
      --bg-elev: #14141c;
      --bg-card: #1a1a24;
      --red: #e50914;
      --red-hover: #f6121d;
      --green: #46d369;
      --text: #ffffff;
      --text-dim: #cfd0dc;
      --text-muted: #9899a8;
      --border: rgba(255, 255, 255, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    /* APK Exact App Shell: Left NavRail (>=600px) + Main Scrollable Content */
    .app-shell {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0b0b0f;
    }
    .nav-rail {
      width: 96px;
      flex-shrink: 0;
      height: 100vh;
      background: #12121a;
      border-right: 1px solid #1e1e2c;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
      z-index: 100;
    }
    .rail-item {
      width: 100%;
      background: transparent;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 9px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
      font-family: inherit;
    }
    .rail-item svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      flex-shrink: 0;
    }
    .rail-item span {
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .rail-item:hover, .rail-item:focus-visible {
      background: #242434;
      border-color: #ffffff;
      outline: none;
    }
    .rail-item.active {
      background: #28161c;
      color: #ff4d57;
    }
    .rail-item.active span {
      font-weight: 700;
    }
    .app-main {
      flex: 1;
      min-width: 0;
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      background: #0b0b0f;
    }

    /* Brand & Hero Top Floating Bar (Matches APK HomeScreen) */
    .hero-top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 24px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }
    .brand-m {
      background: var(--red);
      color: #fff;
      font-weight: 900;
      font-size: 20px;
      padding: 2px 9px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 10px rgba(229,9,20,0.45);
    }
    .brand-text {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: #fff;
    }
    .hero-quick-pills {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      max-width: 100%;
    }
    .search-input {
      background: rgba(20, 20, 30, 0.9);
      border: 1px solid #35354a;
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      width: 100%;
      transition: border-color 0.2s;
    }
    .search-input::placeholder { color: #9eb0c2; }
    .search-input:focus {
      outline: none;
      border-color: var(--red);
    }

    /* Netflix Hero Billboard */
    .hero {
      position: relative;
      width: 100%;
      height: 410px;
      min-height: 360px;
      display: flex;
      align-items: flex-end;
      padding: 74px 24px 22px;
      background-size: cover;
      background-position: center top;
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(11,11,15,0.96) 0%, rgba(11,11,15,0.72) 48%, rgba(11,11,15,0.18) 100%),
        linear-gradient(180deg, rgba(11,11,15,0.75) 0%, rgba(11,11,15,0.1) 35%, rgba(11,11,15,0.88) 85%, #0b0b0f 100%);
    }
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .hero-top-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #fff;
    }
    .top10-pill {
      background: var(--red);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 7px;
      border-radius: 4px;
    }
    .hero-title {
      font-size: clamp(28px, 4.5vw, 52px);
      font-weight: 900;
      line-height: 1.08;
      color: #fff;
      text-shadow: 0 4px 18px rgba(0,0,0,0.85);
    }
    .hero-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
    }
    .match-text { color: var(--green); }
    .hd-badge {
      border: 1px solid rgba(255,255,255,0.65);
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 11px;
      color: #fff;
    }
    .score-text { color: #ffd54f; }
    .hero-genres {
      font-size: 13px;
      color: #e2e3ef;
      font-weight: 600;
    }
    .hero-synopsis {
      font-size: 15px;
      line-height: 1.45;
      color: #dcdde8;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .hero-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 6px;
    }
    .btn-play-netflix {
      background: #ffffff;
      color: #000000;
      border: none;
      font-size: 16px;
      font-weight: 800;
      padding: 11px 24px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s, background 0.15s;
    }
    .btn-play-netflix:hover, .btn-play-netflix:focus-visible {
      background: var(--red);
      color: #ffffff;
      transform: scale(1.03);
      outline: 2px solid #fff;
    }
    .btn-info-netflix {
      background: rgba(65, 65, 82, 0.78);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.28);
      font-size: 15px;
      font-weight: 700;
      padding: 11px 20px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }
    .btn-info-netflix:hover, .btn-info-netflix:focus-visible {
      background: rgba(95, 95, 118, 0.9);
      outline: 2px solid #fff;
    }
    .hero-dots {
      display: flex;
      gap: 7px;
      margin-top: 6px;
    }
    .hero-dot {
      width: 10px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.38);
      cursor: pointer;
      transition: all 0.2s;
    }
    .hero-dot.active {
      width: 26px;
      background: var(--red);
    }

    /* Shelves / Rows */
    .rows-container {
      display: flex;
      flex-direction: column;
      gap: 26px;
      padding: 10px 28px 30px;
    }
    .shelf-title {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .shelf-scroller {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 6px 2px 14px;
      scroll-behavior: smooth;
    }
    .shelf-scroller::-webkit-scrollbar { height: 6px; }
    .shelf-scroller::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.22);
      border-radius: 3px;
    }

    /* Poster Card */
    .poster-card {
      flex: 0 0 156px;
      width: 156px;
      cursor: pointer;
      transition: transform 0.2s ease;
      position: relative;
    }
    .poster-card:hover, .poster-card:focus-visible {
      transform: scale(1.05);
      z-index: 4;
    }
    .poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .poster-card:hover .poster-wrap {
      border-color: #ffffff;
      box-shadow: 0 8px 22px rgba(0,0,0,0.75);
    }
    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-badge-m {
      position: absolute;
      top: 6px;
      left: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .mini-m {
      background: var(--red);
      color: #fff;
      font-weight: 900;
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 3px;
    }
    .mini-year {
      background: rgba(11,11,15,0.85);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .mini-score {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(11,11,15,0.88);
      color: var(--green);
      font-size: 11px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .rank-ribbon {
      position: absolute;
      top: 0;
      left: 0;
      background: var(--red);
      color: #fff;
      padding: 3px 8px;
      border-bottom-right-radius: 8px;
      text-align: center;
      line-height: 1.05;
    }
    .rank-ribbon small { font-size: 8px; font-weight: 900; display: block; }
    .rank-ribbon strong { font-size: 15px; font-weight: 900; }
    .card-progress-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: rgba(255,255,255,0.28);
    }
    .card-progress-fill {
      height: 100%;
      background: var(--red);
    }
    .poster-title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .poster-sub {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Filter Browser Page (Movies, Series, Live TV) */
    .browser-page {
      padding: 18px 22px 32px;
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }
    .page-title {
      font-size: 26px;
      font-weight: 900;
      color: #ffffff;
    }
    .pills-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }
    .pills-row::-webkit-scrollbar { height: 5px; }
    .pills-row::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    .pill {
      flex: 0 0 auto;
      background: #1c1c28;
      color: #ffffff;
      border: 1.5px solid #343448;
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .pill:hover, .pill:focus-visible {
      border-color: #ffffff;
      background: #2c2c3e;
    }
    .pill.active {
      background: var(--red);
      border-color: var(--red);
      font-weight: 800;
    }
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
      margin-top: 14px;
    }
    .media-grid .poster-card {
      width: 100%;
      flex: none;
    }

    /* Detail & Player Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.84);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; }
    .detail-box {
      background: #14141d;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      max-width: 880px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.9);
    }
    .detail-hero {
      position: relative;
      height: 300px;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 24px;
    }
    .detail-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(20,20,29,0.2) 0%, rgba(20,20,29,0.96) 92%, #14141d 100%);
    }
    .close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 5;
      background: rgba(15,15,22,0.85);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }
    .detail-body {
      padding: 0 24px 26px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .ep-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }
    .ep-row {
      background: #1c1c28;
      border: 1px solid #2e2e42;
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .ep-row:hover {
      border-color: var(--red);
      background: #242436;
    }

    /* Fullscreen Player Modal */
    .player-modal {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 300;
      display: none;
      flex-direction: column;
    }
    .player-modal.open { display: flex; }
    .player-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(0, 0, 0, 0.78);
      gap: 12px;
      z-index: 5;
    }
    .player-video-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      max-height: calc(100vh - 60px);
      background: #000;
    }
    .sub-overlay {
      position: absolute;
      bottom: 64px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.82);
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 8px;
      font-size: clamp(15px, 2.2vw, 22px);
      font-weight: 700;
      text-align: center;
      max-width: 86%;
      pointer-events: none;
      display: none;
    }
    .track-panel {
      position: absolute;
      top: 60px;
      right: 20px;
      background: #161622;
      border: 1px solid #3c3c54;
      border-radius: 12px;
      padding: 16px;
      width: 280px;
      max-height: 75vh;
      overflow-y: auto;
      z-index: 20;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    .track-panel.open { display: flex; }

    /* Netflix-style Player Controls Overlay */
    .nf-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, transparent 25%, transparent 68%, rgba(0,0,0,0.88) 100%);
      transition: opacity 0.25s ease;
      z-index: 8;
      pointer-events: none;
    }
    .nf-overlay.hidden { opacity: 0; }
    .nf-overlay > * { pointer-events: auto; }
    .nf-center-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 34px;
      margin: auto 0;
    }
    .nf-ctrl-btn {
      background: rgba(20, 20, 30, 0.72);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.65);
      border-radius: 50%;
      width: 62px;
      height: 62px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s, background 0.15s;
    }
    .nf-ctrl-btn.big {
      width: 78px;
      height: 78px;
      font-size: 28px;
      background: rgba(229, 9, 20, 0.9);
      border-color: #fff;
    }
    .nf-ctrl-btn:hover { transform: scale(1.1); background: rgba(229, 9, 20, 0.92); }
    .nf-bottom-bar {
      padding: 12px 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .nf-scrubber-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }
    .nf-slider {
      flex: 1;
      accent-color: #e50914;
      height: 6px;
      cursor: pointer;
    }
    .nf-toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      padding: 10px 22px;
      border-radius: 30px;
      z-index: 15;
      display: none;
      pointer-events: none;
    }

    /* Responsive Mobile Bottom Bar */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #14141e;
      border-top: 1px solid rgba(255,255,255,0.12);
      z-index: 120;
      justify-content: space-evenly;
      padding: 6px 4px;
    }
    .mob-tab {
      flex: 1;
      background: transparent;
      border: none;
      border-radius: 8px;
      padding: 6px 2px;
      color: #e0e0ec;
      font-size: 10px;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }
    .mob-tab svg { width: 20px; height: 20px; fill: currentColor; }
    .mob-tab.active { background: #28161c; color: #ff4d57; font-weight: 700; }

    /* Flow-style Live TV Guide */
    .flow-page {
      padding: 14px 18px 24px;
      background: #0a0e14;
      min-height: 100vh;
    }
    .flow-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }
    .flow-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .flow-badge {
      background: #00e5b4;
      color: #041411;
      font-weight: 900;
      font-size: 16px;
      padding: 3px 11px;
      border-radius: 6px;
      letter-spacing: 0.4px;
    }
    .flow-live-clock {
      background: #142824;
      border: 1px solid #00e5b4;
      color: #00e5b4;
      font-weight: 800;
      font-size: 13px;
      padding: 5px 12px;
      border-radius: 16px;
    }
    .flow-pill {
      flex: 0 0 auto;
      background: #141d28;
      color: #fff;
      border: 1.5px solid #263547;
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .flow-pill:hover { border-color: #fff; background: #20313d; }
    .flow-pill.active {
      background: #00e5b4;
      border-color: #00e5b4;
      color: #041411;
      font-weight: 800;
    }
    .flow-split {
      display: grid;
      grid-template-columns: 1.25fr 0.85fr;
      gap: 16px;
      margin-top: 12px;
      align-items: start;
    }
    .flow-guide-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 70vh;
      overflow-y: auto;
      padding-right: 4px;
    }
    .flow-row {
      background: #131a24;
      border: 1.5px solid #1f2b3a;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .flow-row:hover, .flow-row.active {
      background: #1a2a32;
      border-color: #00e5b4;
    }
    .flow-ch-num {
      color: #00e5b4;
      font-weight: 900;
      font-size: 16px;
      min-width: 40px;
    }
    .flow-logo-tile {
      width: 54px;
      height: 36px;
      border-radius: 6px;
      background: #0b1018;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
      flex-shrink: 0;
    }
    .flow-logo-tile img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .flow-row-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .flow-row-title {
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .flow-hd-tag {
      background: #1f3640;
      color: #00e5b4;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 3px;
    }
    .flow-epg-sub {
      font-size: 12px;
      color: #9eb0c2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .flow-prog-bar {

      overflow: hidden;
    }
    .flow-prog-fill {
      height: 100%;

    }

      border-radius: 50%;

      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      flex-shrink: 0;
    }
    .flow-row:hover .flow-play-circle, .flow-row.active .flow-play-circle {
      background: #00e5b4;
      color: #041411;
    }
    .flow-preview-card {
      background: #131a24;
      border: 1px solid #223446;
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: sticky;
      top: 82px;
    }
    .flow-preview-screen {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      background: linear-gradient(135deg, #0b141e 0%, #132a2e 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }
    .flow-preview-screen img {
      max-width: 65%;
      max-height: 65%;
      object-fit: contain;
      position: relative;
      z-index: 1;

      position: absolute;
      inset: 0;
      width: 100%;

      object-fit: contain;

    @media (max-width: 599px) {
      .nav-rail { display: none; }

  <script>
    const SNAP = window.MARIANFLIX_SNAPSHOT || { featured: [], movies: [], series: [], liveCategories: [], liveChannels: [] };
    const GENRE_MAP = {
      "action": "Acción", "accion": "Acción", "acción": "Acción",
      "sci-fi": "Ciencia ficción", "science fiction": "Ciencia ficción", "ciencia ficción": "Ciencia ficción",
      "adventure": "Aventura", "aventuras": "Aventura",
      "comedy": "Comedia", "comedia": "Comedia", "comedia de situación": "Comedia",
      "drama": "Drama",
      "horror": "Terror", "terror": "Terror",
      "thriller": "Suspenso", "suspenso": "Suspenso",
      "crime": "Crimen", "crimen": "Crimen",
      "fantasy": "Fantasía", "fantastico": "Fantasía", "fantasía": "Fantasía",
      "mystery": "Misterio", "misterio": "Misterio",
      "romance": "Romance", "romántico": "Romance",
      "animation": "Animación", "animación": "Animación",
      "family": "Familia", "familia": "Familia",
      "biography": "Biografía", "biografía": "Biografía",
      "history": "Historia", "historia": "Historia",
      "documentary": "Documental", "documental": "Documental",
      "war": "Guerra", "guerra": "Guerra"
    };

    const STANDARD_CATEGORIES = [
      "Todas", "Acción", "Comedia", "Drama", "Terror", "Ciencia ficción",
      "Suspenso", "Aventura", "Romance", "Familia", "Crimen", "Fantasía",
      "Misterio", "Animación", "Biografía", "Historia", "Documental"
    ];
    const API_BASE = location.protocol === "file:" ? "http://localhost:3080" : "";
    const NOW_MONTH_PREFIX = (() => {
      const d = new Date();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      return `${d.getFullYear()}-${mm}`;
    })();
    const STANDARD_YEARS = ["Todos", "Este mes", "2026", "2025", "2024", "2023", "2022", "2021", "2020", "2019", "2018", "Anteriores"];

    let state = {
      section: "home",
      homeFilter: "all",
      heroIndex: 0,
      featured: [],
      movies: [],
      series: [],
      liveCategories: [],
      liveChannels: [],
      liveLoadedFromApi: false,
      selectedLiveCat: "__ALL_MERGED__",
      liveTab: 0,
      selectedLiveChannelId: null,
      liveSearch: "",
      selectedCategory: "Todas",
      selectedYear: "Todos",
      catalogPage: 1,
      loadingMore: false,
      sortBy: "year",
      searchQuery: "",
      searchResults: [],
      activeDetail: null
    };

    function normalizeItem(raw, defaultKind) {
      if (!raw || !raw.id) return null;
      const isSer = raw.kind === "serie" || raw.kind === "series" || raw.type === "teleplay" || defaultKind === "series";
      const rawGenres = Array.isArray(raw.genres) ? raw.genres : [];
      const genres = [];
      rawGenres.forEach(g => {
        const clean = GENRE_MAP[String(g || "").trim().toLowerCase()] || String(g || "").trim();
        if (clean && !genres.includes(clean)) genres.push(clean);
      });
      if (raw.row && !/^(all|\d+)$/i.test(raw.row)) {
        const mappedRow = GENRE_MAP[String(raw.row).trim().toLowerCase()] || String(raw.row).trim();
        if (mappedRow && !genres.includes(mappedRow)) genres.push(mappedRow);
      }
      let relDate = String(raw.releaseDate || raw.releaseTime || "").trim();
      let yr = String(raw.year || "").trim();
      if (/^\d{4}/.test(relDate)) yr = relDate.slice(0, 4);
      if (!/^\d{4}$/.test(yr)) {
        const m = String((raw.title || "") + " " + (raw.row || "") + " " + relDate).match(/\b(19[7-9]\d|20[0-2]\d)\b/);
        yr = m ? m[1] : "";
      }
      if (!relDate && yr) relDate = yr + "-01-01";
      return {
        id: String(raw.id),
        title: String(raw.title || raw.name || "Título"),
        kind: isSer ? "series" : "movie",
        year: yr,
        releaseDate: relDate,
        score: (raw.score && raw.score !== "—" && raw.score !== "0") ? String(raw.score) : "8.4",
        duration: String(raw.duration || ""),
        genres: genres.length ? genres : ["Destacado"],
        synopsis: String(raw.synopsis || raw.description || ""),
        poster: String(raw.poster || raw.backdrop || ""),
        backdrop: String(raw.backdrop || raw.landscape || raw.poster || ""),
        row: String(raw.row || "")
      };
    }

    // LocalStorage Helpers for Favorites & Watch Progress
    function getFavorites() {
      try { return JSON.parse(localStorage.getItem("mf_web_favs") || "[]"); } catch (_) { return []; }
    }
    function isFavorite(id) {
      return getFavorites().some(x => x.id === id);
    }
    function toggleFavorite(item) {
      const list = getFavorites();
      const idx = list.findIndex(x => x.id === item.id);
      if (idx >= 0) list.splice(idx, 1);
      else list.unshift(item);
      localStorage.setItem("mf_web_favs", JSON.stringify(list.slice(0, 200)));
      render();
    }

    function getProgressMap() {
      try { return JSON.parse(localStorage.getItem("mf_web_progress") || "{}"); } catch (_) { return {}; }
    }
    function getProgress(id) {
      return getProgressMap()[id] || null;
    }
    function saveProgress(playId, posSec, durSec, title, itemObj) {
      if (!posSec || posSec < 3) return;
      const map = getProgressMap();
      const effPos = (durSec > 60 && posSec >= durSec - 25) ? 0 : Math.floor(posSec);
      const entry = {
        id: playId,
        posSec: effPos,
        durSec: Math.floor(durSec || 0),
        title: title || "",
        item: itemObj || (map[playId] && map[playId].item) || null,
        updatedAt: Date.now()
      };
      map[playId] = entry;
      if (playId.includes(":")) {
        const seriesId = playId.split(":")[1];
        if (seriesId) {
          map[seriesId] = Object.assign({}, entry, { id: seriesId, episodeId: playId });
        }
      }
      localStorage.setItem("mf_web_progress", JSON.stringify(map));
    }
    function clearProgress(id) {
      const map = getProgressMap();
      delete map[id];
      Object.keys(map).forEach(k => { if (k.endsWith(":" + id)) delete map[k]; });
      localStorage.setItem("mf_web_progress", JSON.stringify(map));
    }
    function formatSec(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      const pad = n => (n < 10 ? "0" + n : "" + n);
      return h > 0 ? `${h}:${pad(m)}:${pad(r)}` : `${pad(m)}:${pad(r)}`;
    }

    async function apiGet(path, timeoutMs = 8000) {
      const url = path.startsWith("http") ? path : (API_BASE + path);
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(url, { signal: ctrl.signal });
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.json();
      } finally {
        clearTimeout(t);
      }
    }

      state.section = "search";

      const seen = new Set();
      state.searchResults = localPool.filter(item => {

        const match = item.title.toLowerCase().includes(q) ||
          item.year.includes(q) ||

        if (match) { seen.add(item.id); return true; }
        return false;

      }[c]));

    async function loadShelveIntoCatalog(kind, category, year, page) {
      const apiKind = kind === "series" ? "series" : "movies";
      state.loadingMore = true;
      render();
      try {
        const data = await apiGet(`/api/shelve?kind=${apiKind}&category=${encodeURIComponent(category)}&year=${encodeURIComponent(year)}&page=${page}`);
        if (data && data.items) mergeIntoCatalog(data.items, kind);
      } catch (_) {}
      state.loadingMore = false;
      render();
    }

      state.catalogPage += 1;
      await loadShelveIntoCatalog(kind, state.selectedCategory, state.selectedYear, state.catalogPage);
    }

    async function selectCategoryFilter(cat, kind) {
      state.selectedCategory = cat;
      state.catalogPage = 1;
      render();
      if (kind === "movie" || kind === "series") {
        await loadShelveIntoCatalog(kind, cat, state.selectedYear, 1);
      }
    }

    async function selectYearFilter(yr, kind) {
      state.selectedYear = yr;
      state.catalogPage = 1;
      render();
      if (kind === "movie" || kind === "series") {
        await loadShelveIntoCatalog(kind, state.selectedCategory, yr, 1);
        if (yr !== "Todos" && yr !== "2026" && yr !== "Anteriores") {
          try {
            const data = await apiGet(`/api/search?q=${encodeURIComponent(yr)}`);
            if (data && data.items) mergeIntoCatalog(data.items, kind, yr);
          } catch (_) {}
        }
      }
    }

    function mergeIntoCatalog(rawItems, kind, forcedYear) {
      rawItems.forEach(raw => {
        const norm = normalizeItem(raw, kind === "series" ? "series" : "movie");
        if (!norm) return;
        if (forcedYear && (!norm.year || norm.year === "2025")) norm.year = forcedYear;
        if (norm.kind === "series") {
          const idx = state.series.findIndex(x => x.id === norm.id);
          if (idx >= 0) state.series[idx] = norm; else state.series.push(norm);
        } else {
          const idx = state.movies.findIndex(x => x.id === norm.id);
          if (idx >= 0) state.movies[idx] = norm; else state.movies.push(norm);
        }
      });
      render();
    }

    function getWebEpgSchedule(ch, count = 3) {
      const name = String((ch && (ch.name || ch.title)) || "");
      const cat = String((ch && ch.category) || "");
      const num = Number((ch && (ch.index || ch.number)) || 1);
      const txt = (cat + " " + name).toLowerCase();
      let pool = [
        ["Magazine en Vivo", "Actualidad, espectáculos, invitados y entretenimiento."],
        ["Prime Time Show", "El programa central de la noche en vivo."],
        ["Ficción y Entretenimiento", "Contenido destacado de la programación diaria."],
        ["Cultura y Sociedad", "Historias, documentales y entrevistas en profundidad."],
        ["Late Night en Vivo", "Humor, música e invitados especiales."]
      ];
      if (/notic|news|26|tn\b|c5n|dw/.test(txt)) {
        pool = [
          ["Edición Central de Noticias", "Resumen informativo con móviles en vivo y análisis."],
          ["Panorama Internacional", "Cobertura global de actualidad, economía y política."],
          ["Debate Abierto", "Mesa de periodistas y especialistas analizando el día."],

          ["Fútbol en Vivo: Especial Jornada", "Transmisión en directo, previas y análisis táctico."],
          ["SportsCenter / Resumen", "Goles, estadísticas y lo mejor del deporte mundial."],
          ["Mesa Deportiva", "Debate, entrevistas y actualidad de las ligas."],
          ["Automovilismo y Motor", "Clasificaciones, carreras y cobertura en pista."]
        ];
      } else if (/cine|movie|film|serie|hbo|amc/.test(txt)) {
        pool = [
          ["Estreno de Cine: Acción Total", "Largometraje en alta definición sin cortes."],
          ["Noche de Suspenso", "Thriller cinematográfico seleccionado."],
          ["Cine Clásico Restaurado", "Película destacada en calidad digital."],
          ["Maratón de Series", "Episodios continuados de drama y misterio."]
        ];
      } else if (/kid|infantil|cartoon|disney|anim/.test(txt)) {
        pool = [
          ["Aventuras Animadas", "Episodios divertidos para los más chicos."],
          ["Mundo Kids", "Series educativas, música y juegos."],
          ["Súper Héroes Junior", "Capítulo estreno de animación."]
        ];
      } else if (/music|músic|mtv|htv/.test(txt)) {
        pool = [
          ["Top Hits 24/7", "Los videos musicales más escuchados del momento."],
          ["Sesiones en Vivo", "Recitales y acústicos exclusivos."],
          ["Clásicos del Rock & Pop", "Éxitos inolvidables de todas las décadas."]
        ];
      }
      const nowMs = Date.now();
      const slotMs = (num % 2 === 0) ? 3600000 : 1800000;
      const base = Math.floor(nowMs / slotMs) * slotMs;
      const pad2 = n => (n < 10 ? "0" + n : "" + n);
      const fmt = ms => { const d = new Date(ms); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
      const out = [];
      for (let i = 0; i < count; i++) {
        const start = base + i * slotMs;
        const end = start + slotMs;
        const idx = Math.abs(Math.floor(start / slotMs) + num * 7) % pool.length;
        const pct = Math.max(5, Math.min(98, Math.round(((nowMs - start) / slotMs) * 100)));
        out.push({ title: pool[idx][0], desc: pool[idx][1], range: `${fmt(start)} - ${fmt(end)}`, pct });
      }
      return out;
    }

    let previewHls = null;
    let previewTimer = null;
    let previewActiveCode = "";
    let previewMuted = true;

    function stopLivePreview() {
      if (previewTimer) { clearTimeout(previewTimer); previewTimer = null; }
      previewActiveCode = "";
      if (previewHls) {
        try { previewHls.destroy(); } catch (_) {}
        previewHls = null;
      }
      const pv = document.getElementById("previewVideoEl");
      if (pv) {
        try { pv.pause(); pv.removeAttribute("src"); pv.load(); } catch (_) {}
        pv.classList.remove("playing");
      }
    }

    function togglePreviewMute(ev) {
      if (ev) ev.stopPropagation();
      previewMuted = !previewMuted;
      const pv = document.getElementById("previewVideoEl");
      if (pv) pv.muted = previewMuted;
      const btn = document.getElementById("previewMuteBtn");
      if (btn) btn.textContent = previewMuted ? "🔇 Sonido" : "🔊 Sonido";
    }

    function scheduleLivePreview(code) {
      if (!code || state.section !== "live" || state.liveTab !== 0) {
        stopLivePreview();
        return;
      }
      if (window.innerWidth < 600) {
        stopLivePreview();
        return;
      }
      if (previewTimer) clearTimeout(previewTimer);
      previewTimer = setTimeout(() => startLivePreview(code), 380);
    }

    async function startLivePreview(code) {
      if (!code || state.section !== "live" || state.liveTab !== 0) return;
      const modal = document.getElementById("playerModal");
      if (modal && modal.classList.contains("open")) return;
      const pv = document.getElementById("previewVideoEl");
      if (!pv) return;
      if (previewActiveCode === code && previewHls) return;

      stopLivePreview();
      previewActiveCode = code;

      try {
        const chObj = state.liveChannels.find(c => String(c.channelCode || c.id) === String(code));
        let streamUrl = "";
        if (chObj && chObj.streamUrl && /^https?:\/\//i.test(chObj.streamUrl)) {
          streamUrl = chObj.streamUrl;
        } else {
          const data = await apiGet(`/api/resolve-live?code=${encodeURIComponent(code)}`);
          if (previewActiveCode !== code) return;
          streamUrl = data.streamUrl ? (data.streamUrl.startsWith("http") ? data.streamUrl : (API_BASE + data.streamUrl)) : (data.proxyUrl || "");
        }
        if (!streamUrl || previewActiveCode !== code) return;

        const videoEl = document.getElementById("previewVideoEl");
        if (!videoEl) return;
        videoEl.muted = previewMuted;
        videoEl.playsInline = true;
        videoEl.onplaying = () => videoEl.classList.add("playing");

        if (window.Hls && Hls.isSupported()) {
          previewHls = new Hls({ maxBufferLength: 10, maxMaxBufferLength: 20, enableWorker: true });
          previewHls.loadSource(streamUrl);
          previewHls.attachMedia(videoEl);
          previewHls.on(Hls.Events.MANIFEST_PARSED, () => {
            videoEl.play().catch(() => {});
          });
          previewHls.on(Hls.Events.ERROR, (_, errData) => {
            if (errData && errData.fatal) {
              try { previewHls.destroy(); } catch (_) {}
              previewHls = null;
              videoEl.classList.remove("playing");
            }
          });
        } else if (videoEl.canPlayType("application/vnd.apple.mpegurl")) {
          videoEl.src = streamUrl;
          videoEl.play().catch(() => {});
        }
      } catch (_) {}
    }

                    ${epPos > 3 ? `<div style="font-size:12px;color:#ff525b;margin-top:3px;">Guardado en ${formatSec(epPos)}</div>` : ""}
                  </div>
                  <span style="color:#ff525b;font-weight:800;font-size:14px;">
                    ${epPos > 3 ? `Continuar (${formatSec(epPos)}) ▶` : "Reproducir ▶"}
                  </span>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      ` : "";

      box.innerHTML = `
        <div class="detail-hero" style="background-image:url('${escapeHtml(item.backdrop || item.poster)}')">
          <button class="close-btn" onclick="closeDetail()">✕</button>
          <div style="position:relative;z-index:2;">
            <div class="hero-top-badge" style="margin-bottom:6px;">
              <span class="mini-m">M</span>
              <span>${item.kind === "series" ? "SERIE" : "PELÍCULA"}</span>
            </div>
            <h2 style="font-size:30px;font-weight:900;color:#fff;">${escapeHtml(item.title)}</h2>
          </div>
        </div>
        <div class="detail-body">
          <div class="hero-meta">
            <span class="match-text">98% para ti</span>
            <span>${escapeHtml(item.year)}</span>
            <span class="hd-badge">HD</span>
            <span class="score-text">★ ${escapeHtml(item.score)}</span>
            ${item.duration ? `<span>${escapeHtml(item.duration)}</span>` : ""}
          </div>
          <div class="hero-genres" style="color:#ff525b;">${(item.genres || []).map(escapeHtml).join(" • ")}</div>
          <p style="color:#e4e5f0;line-height:1.5;font-size:15px;">${escapeHtml(item.synopsis || "")}</p>

          <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:4px;">
            <button class="btn-play-netflix" onclick="playFromDetail(false)">
              ${hasResume ? `▶ Continuar (${formatSec(saved.posSec)})` : "▶ Reproducir"}
            </button>
            ${hasResume ? `<button class="btn-info-netflix" onclick="playFromDetail(true)">↺ Desde el inicio</button>` : ""}
            <button class="btn-info-netflix" onclick="toggleFavoriteById('${escapeHtml(item.id)}');renderDetailModal();">
              ${isFavorite(item.id) ? "★ Quitar de Mi Lista" : "☆ Agregar a Mi Lista"}
            </button>
          </div>
          ${epHtml}
        </div>
      `;
    }

    function closeDetail() {
      document.getElementById("detailModal").classList.remove("open");
    }

    async function playDirectly(id) {
      const it = findItemById(id);
      if (it && it.kind === "series") {
        openDetail(id);
      } else {
        startVodPlayback(id, "", it ? it.title : id, false);
      }
    }

    function playFromDetail(fromStart) {
      const d = state.activeDetail;
      if (!d) return;
      const item = d.item;
      if (fromStart) clearProgress(item.id);
      const saved = !fromStart ? getProgress(item.id) : null;
      if (d.episodes && d.episodes.length > 0) {
        let ep = d.episodes[0];
        if (saved && saved.episodeId) {
          const epIdOnly = String(saved.episodeId).split(":")[0];
          ep = d.episodes.find(x => x.id === epIdOnly) || ep;
        }
        startVodPlayback(ep.id, item.id, `${item.title} - ${ep.title}`, fromStart);
      } else {
        startVodPlayback(item.id, "", item.title, fromStart);
      }
    }

    // Video Player Engine (mpegts.js + hls.js + SRT Subtitles + Position Persistence)
    let activePlayer = {
      mpegtsPlayer: null,
      hlsPlayer: null,
      playKey: "",
      title: "",
      isLive: false,
      itemObj: null,
      subtitles: [],
      selectedSubIdx: -1,
      srtCues: [],
      saveInterval: null
    };

    function destroyActivePlayers() {
      if (activePlayer.saveInterval) {
        clearInterval(activePlayer.saveInterval);
        activePlayer.saveInterval = null;
      }
      if (activePlayer.mpegtsPlayer) {
        try {
          activePlayer.mpegtsPlayer.unload();
          activePlayer.mpegtsPlayer.detachMediaElement();
          activePlayer.mpegtsPlayer.destroy();
        } catch (_) {}
        activePlayer.mpegtsPlayer = null;
      }
      if (activePlayer.hlsPlayer) {
        try { activePlayer.hlsPlayer.destroy(); } catch (_) {}
        activePlayer.hlsPlayer = null;
      }
      const video = document.getElementById("videoEl");
      video.pause();
      video.removeAttribute("src");
      video.load();
    }

    function parseSrtText(raw) {
      if (!raw) return [];
      const blocks = raw.replace(/\r\n/g, "\n").split(/\n\s*\n/);
      const regex = /(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})/;
      const cues = [];
      for (const b of blocks) {
        const lines = b.split("\n").map(l => l.trim()).filter(Boolean);
        if (lines.length < 2) continue;
        const idx = lines.findIndex(l => regex.test(l));
        if (idx < 0 || idx + 1 >= lines.length) continue;
        const m = lines[idx].match(regex);
        if (!m) continue;
        const toSec = (h, min, s, ms) => (+h * 3600) + (+min * 60) + (+s) + (+(ms.padEnd(3, "0").slice(0, 3)) / 1000);
        const start = toSec(m[1], m[2], m[3], m[4]);
        const end = toSec(m[5], m[6], m[7], m[8]);
        const text = lines.slice(idx + 1).join("\n").replace(/<[^>]*>/g, "").trim();
        if (text && end > start) cues.push({ start, end, text });
      }
      return cues;
    }

    async function selectSubtitle(idx) {
      activePlayer.selectedSubIdx = idx;
      activePlayer.srtCues = [];
      document.getElementById("subOverlay").style.display = "none";
      renderTrackPanel();
      if (idx < 0 || !activePlayer.subtitles[idx]) return;
      try {
        const subUrl = activePlayer.subtitles[idx].url;
        const res = await fetch(subUrl.startsWith("http") ? subUrl : (API_BASE + subUrl));
        const txt = await res.text();
        activePlayer.srtCues = parseSrtText(txt);
      } catch (_) {}
    }

    function humanLangName(code) {
      const c = String(code || "").toLowerCase();
      if (c.includes("lat")) return "Español Latino";
      if (c.includes("es") || c.includes("spa")) return "Español";
      if (c.includes("en") || c.includes("eng")) return "Inglés";
      if (c.includes("pt") || c.includes("por")) return "Portugués";
      if (c.includes("fr") || c.includes("fre")) return "Francés";
      return code.toUpperCase() || "Idioma";
    }

    let overlayHideTimer = null;
    let isScrubbing = false;

    function showPlayerOverlay() {
      const ov = document.getElementById("nfOverlay");
      if (!ov) return;
      ov.classList.remove("hidden");
      clearTimeout(overlayHideTimer);
      overlayHideTimer = setTimeout(() => {
        const v = document.getElementById("videoEl");
        if (v && !v.paused && !document.getElementById("trackPanel").classList.contains("open")) {
          ov.classList.add("hidden");
        }
      }, 3500);
    }

    function showSeekToast(msg) {
      const el = document.getElementById("nfToast");
      if (!el) return;
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(el._t);
      el._t = setTimeout(() => { el.style.display = "none"; }, 800);
    }

    function togglePlayPause() {
      const v = document.getElementById("videoEl");
      if (!v) return;
      if (v.paused) v.play().catch(() => {});
      else v.pause();
      updatePlayPauseIcon();
      showPlayerOverlay();
    }

    function updatePlayPauseIcon() {
      const v = document.getElementById("videoEl");
      const btn = document.getElementById("nfPlayPauseBtn");
      if (btn && v) btn.textContent = v.paused ? "▶" : "⏸";
    }

    function seekRelative(deltaSec) {
      if (activePlayer.isLive) return;
      const v = document.getElementById("videoEl");
      if (!v) return;
      const maxDur = (isFinite(v.duration) && v.duration > 0) ? v.duration : (activePlayer.durationSec || 7200);
      const next = Math.max(0, Math.min(maxDur - 1, (v.currentTime || 0) + deltaSec));
      v.currentTime = next;
      showSeekToast(deltaSec > 0 ? `+${deltaSec}s ↻` : `↺ ${deltaSec}s`);
      showPlayerOverlay();
    }

    function onScrubInput(val) {
      isScrubbing = true;
      document.getElementById("nfCurTime").textContent = formatSec(Number(val));
      showPlayerOverlay();
    }

    function onScrubCommit(val) {
      isScrubbing = false;
      const v = document.getElementById("videoEl");
      if (v && !activePlayer.isLive) {
        v.currentTime = Number(val);
      }
      showPlayerOverlay();
    }

    function toggleFullscreenPlayer() {
      const el = document.getElementById("playerModal");
      if (!document.fullscreenElement) el.requestFullscreen && el.requestFullscreen().catch(() => {});
      else document.exitFullscreen && document.exitFullscreen().catch(() => {});
    }

    window.addEventListener("keydown", (ev) => {
      const modal = document.getElementById("playerModal");
      if (!modal || !modal.classList.contains("open")) return;
      if (activePlayer.isLive) {
        if (ev.key === "ArrowUp") { ev.preventDefault(); zapLiveChannel(1); return; }
        if (ev.key === "ArrowDown") { ev.preventDefault(); zapLiveChannel(-1); return; }
      }
      if (ev.key === "ArrowRight") { ev.preventDefault(); seekRelative(10); }
      else if (ev.key === "ArrowLeft") { ev.preventDefault(); seekRelative(-10); }
      else if (ev.key === " ") { ev.preventDefault(); togglePlayPause(); }
      else if (ev.key === "Escape") { closePlayer(); }
    });

    function openTrackMenu(mode) {
      const panel = document.getElementById("trackPanel");
      if (panel.classList.contains("open") && activePlayer.menuMode === mode) {
        panel.classList.remove("open");
        return;
      }
      activePlayer.menuMode = mode;
      panel.classList.add("open");
      renderTrackPanel();
      showPlayerOverlay();
    }

    function renderTrackPanel() {
      const panel = document.getElementById("trackPanel");
      const mode = activePlayer.menuMode || "audio";
      if (mode === "audio") {
        const tracks = activePlayer.audioTracks && activePlayer.audioTracks.length
          ? activePlayer.audioTracks
          : [{ index: 0, lang: "es" }];
        panel.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong style="font-size:16px;color:#fff;">🔊 Idioma de Audio</strong>
            <button class="pill" style="padding:4px 10px;" onclick="document.getElementById('trackPanel').classList.remove('open')">✕</button>
          </div>
          ${tracks.map(t => {
            const sel = activePlayer.selectedAudioIdx === t.index;
            return `
              <button class="pill ${sel ? 'active' : ''}" style="text-align:left;" onclick="selectAudioTrack(${t.index})">
                ${sel ? "✓ " : ""}${escapeHtml(humanLangName(t.lang))} (Pista ${t.index + 1})
              </button>
            `;
          }).join("")}
        `;
      } else {
        const subs = activePlayer.subtitles || [];
        panel.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong style="font-size:16px;color:#fff;">💬 Subtítulos</strong>
            <button class="pill" style="padding:4px 10px;" onclick="document.getElementById('trackPanel').classList.remove('open')">✕</button>
          </div>
          <button class="pill ${activePlayer.selectedSubIdx === -1 ? 'active' : ''}" style="text-align:left;" onclick="selectSubtitle(-1)">
            ${activePlayer.selectedSubIdx === -1 ? "✓ " : ""}Desactivados
          </button>
          ${subs.map((s, idx) => `
            <button class="pill ${activePlayer.selectedSubIdx === idx ? 'active' : ''}" style="text-align:left;" onclick="selectSubtitle(${idx})">
              ${activePlayer.selectedSubIdx === idx ? "✓ " : ""}${escapeHtml(humanLangName(s.lang))}
            </button>
          `).join("")}
        `;
      }
    }

    function loadVodEngine(resumeSec) {
      const video = document.getElementById("videoEl");
      if (activePlayer.hlsPlayer) { try { activePlayer.hlsPlayer.destroy(); } catch (_) {} activePlayer.hlsPlayer = null; }
      if (activePlayer.mpegtsPlayer) {
        try { activePlayer.mpegtsPlayer.unload(); activePlayer.mpegtsPlayer.detachMediaElement(); activePlayer.mpegtsPlayer.destroy(); } catch (_) {}
        activePlayer.mpegtsPlayer = null;
      }

      const audioIdx = activePlayer.selectedAudioIdx || 0;
      const hlsBase = activePlayer.hlsUrl ? (activePlayer.hlsUrl.startsWith("http") ? activePlayer.hlsUrl : (API_BASE + activePlayer.hlsUrl)) : "";
      const directUrl = activePlayer.streamUrl.startsWith("http") ? activePlayer.streamUrl : (API_BASE + activePlayer.streamUrl);

      if (hlsBase && window.Hls && Hls.isSupported()) {
        const hlsUrlWithAudio = `${hlsBase}?audio=${audioIdx}`;
        const hls = new Hls({ enableWorker: false, startPosition: resumeSec > 3 ? resumeSec : 0 });
        activePlayer.hlsPlayer = hls;
        hls.loadSource(hlsUrlWithAudio);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (resumeSec > 3) video.currentTime = resumeSec;
          video.play().catch(() => {});
          updatePlayPauseIcon();
        });
        hls.on(Hls.Events.ERROR, (ev, data) => {
          if (data && data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
            else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
          }
        });
      } else if (activePlayer.format === "ts" && window.mpegts && mpegts.isSupported()) {
        const player = mpegts.createPlayer({ type: "mpegts", isLive: false, url: directUrl }, { enableWorker: false, lazyLoadMaxDuration: 180 });
        activePlayer.mpegtsPlayer = player;
        player.attachMediaElement(video);
        player.load();
        video.addEventListener("loadedmetadata", function onMeta() {
          video.removeEventListener("loadedmetadata", onMeta);
          if (resumeSec > 3) video.currentTime = resumeSec;
          video.play().catch(() => {});
          updatePlayPauseIcon();
        });
      } else {
        video.src = directUrl;
        video.addEventListener("loadedmetadata", function onMeta() {
          video.removeEventListener("loadedmetadata", onMeta);
          if (resumeSec > 3) video.currentTime = resumeSec;
          video.play().catch(() => {});
          updatePlayPauseIcon();
        });
      }
    }

    function selectAudioTrack(idx) {
      if (activePlayer.selectedAudioIdx === idx) {
        document.getElementById("trackPanel").classList.remove("open");
        return;
      }
      const v = document.getElementById("videoEl");
      const curPos = (v && isFinite(v.currentTime)) ? v.currentTime : 0;
      activePlayer.selectedAudioIdx = idx;
      document.getElementById("trackPanel").classList.remove("open");
      showSeekToast("🔊 " + humanLangName((activePlayer.audioTracks[idx] || {}).lang || "es"));
      loadVodEngine(curPos);
    }

    async function startVodPlayback(contentId, seriesId, title, fromStart) {
      closeDetail();
      destroyActivePlayers();
      stopLivePreview();
      const modal = document.getElementById("playerModal");
      modal.classList.add("open");
      document.getElementById("playerTitle").textContent = title || "Cargando...";
      document.getElementById("playerVodControls").style.display = "flex";
      document.getElementById("playerLiveControls").style.display = "none";
      document.getElementById("videoEl").style.objectFit = "contain";
      document.getElementById("nfCenterControls").style.display = "flex";
      document.getElementById("nfBottomBar").style.display = "flex";
      showPlayerOverlay();

      const playKey = seriesId ? `${contentId}:${seriesId}` : contentId;
      const saved = !fromStart ? getProgress(playKey) : null;
      const resumeSec = (saved && saved.posSec > 3) ? saved.posSec : 0;

      activePlayer.playKey = playKey;
      activePlayer.title = title;
      activePlayer.isLive = false;
      activePlayer.itemObj = findItemById(seriesId || contentId);
      activePlayer.selectedAudioIdx = 0;

      try {
        const pb = await apiGet(`/api/resolve-vod?id=${encodeURIComponent(contentId)}&seriesId=${encodeURIComponent(seriesId || "")}`);
        activePlayer.subtitles = pb.subtitles || [];
        activePlayer.audioTracks = pb.audioTracks || [{ index: 0, lang: "es" }];
        activePlayer.hlsUrl = pb.hlsUrl || "";
        activePlayer.streamUrl = pb.streamUrl || "";
        activePlayer.format = pb.format || "ts";
        activePlayer.durationSec = pb.duration || 0;

        // Auto-select Spanish subtitle if available
        const esIdx = activePlayer.subtitles.findIndex(s => String(s.lang).toLowerCase().startsWith("es"));
        await selectSubtitle(esIdx);

        loadVodEngine(resumeSec);

        const video = document.getElementById("videoEl");
        activePlayer.saveInterval = setInterval(() => {
          if (!video.paused && video.currentTime > 3) {
            saveProgress(playKey, video.currentTime, video.duration || activePlayer.durationSec, title, activePlayer.itemObj);
          }
        }, 3000);
      } catch (e) {
        document.getElementById("playerTitle").textContent = "Iniciá Iniciar_Marianflix_Web.bat para reproducir el stream del portal";
      }
    }

    let liveZoomCover = false;
    function updateLiveFavBtn() {
      const btn = document.getElementById("btnLiveFav");
      if (btn && activePlayer.liveCode) {
        const fav = isLiveFav(activePlayer.liveCode);
        btn.textContent = fav ? "♥ Fav" : "♡ Fav";
        btn.classList.toggle("active", fav);
      }
    }
    function toggleActiveLiveFav() {
      if (activePlayer.liveCode) toggleLiveFav(activePlayer.liveCode);
    }
    function toggleLiveZoom() {
      liveZoomCover = !liveZoomCover;
      const v = document.getElementById("videoEl");
      if (v) v.style.objectFit = liveZoomCover ? "cover" : "contain";
      const btn = document.getElementById("btnLiveZoom");
      if (btn) {
        btn.textContent = liveZoomCover ? "Zoom: Llenar" : "Zoom: Ajustar";
        btn.classList.toggle("active", liveZoomCover);
      }
    }
    function zapLiveChannel(delta) {
      if (!activePlayer.isLive || !state.liveChannels.length) return;
      const idx = state.liveChannels.findIndex(c => (c.channelCode || c.id) === activePlayer.liveCode);
      const nextIdx = ((idx < 0 ? 0 : idx) + delta + state.liveChannels.length) % state.liveChannels.length;
      const ch = state.liveChannels[nextIdx];
      startLivePlayback(ch.channelCode || ch.id, ch.name || ch.title || "Canal");
    }
    function findWebBackupChannel(failedCode, failedName, excluded) {
      const norm = s => String(s || "").toLowerCase().replace(/\([^)]*\)|\[[^\]]*\]|[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
      const target = norm(failedName);
      if (!target) return null;
      let best = null, bestScore = 0;
      for (const ch of state.liveChannels) {
        const code = ch.channelCode || ch.id;
        if (code === failedCode || excluded.has(code)) continue;
        const cand = norm(ch.name || ch.title);
        let score = 0;
        if (cand === target) score = 100;
        else if (cand.startsWith(target) || target.startsWith(cand)) score = 80;
        if (score > bestScore) { bestScore = score; best = ch; if (score === 100) break; }
      }
      return best;
    }

    async function startLivePlayback(code, name, failedSet) {
      destroyActivePlayers();
      stopLivePreview();
      const modal = document.getElementById("playerModal");
      modal.classList.add("open");
      localStorage.setItem("mf_web_last_live", String(code));
      activePlayer.liveCode = String(code);
      activePlayer.liveName = String(name);
      const excluded = failedSet || new Set();

      document.getElementById("playerTitle").textContent = "EN VIVO • " + name;
      document.getElementById("playerVodControls").style.display = "none";
      document.getElementById("playerLiveControls").style.display = "flex";
      document.getElementById("nfCenterControls").style.display = "none";
      document.getElementById("nfBottomBar").style.display = "none";
      document.getElementById("trackPanel").classList.remove("open");
      document.getElementById("subOverlay").style.display = "none";
      activePlayer.isLive = true;
      updateLiveFavBtn();

      try {
        const chObj = state.liveChannels.find(c => String(c.channelCode || c.id) === String(code));
        let fullLiveUrl = "";
        if (chObj && chObj.streamUrl && /^https?:\/\//i.test(chObj.streamUrl)) {
          fullLiveUrl = chObj.streamUrl;
        } else {
          const pb = await apiGet(`/api/resolve-live?code=${encodeURIComponent(code)}`);
          fullLiveUrl = pb.streamUrl.startsWith("http") ? pb.streamUrl : (API_BASE + pb.streamUrl);
        }
        const video = document.getElementById("videoEl");
        video.controls = true;
        video.style.objectFit = liveZoomCover ? "cover" : "contain";
        if (window.Hls && Hls.isSupported()) {
          const hls = new Hls({ enableWorker: false, lowLatencyMode: false });
          activePlayer.hlsPlayer = hls;
          hls.loadSource(fullLiveUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
          hls.on(Hls.Events.ERROR, (ev, data) => {
            if (data && data.fatal) {
              if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                hls.recoverMediaError();
              } else if (excluded.size < 3) {
                excluded.add(String(code));
                const backup = findWebBackupChannel(String(code), name, excluded);
                if (backup) {
                  showSeekToast("Respaldo: " + (backup.name || backup.title));
                  startLivePlayback(backup.channelCode || backup.id, backup.name || backup.title, excluded);
                }
              }
            }
          });
        } else {
          video.src = fullLiveUrl;
          video.play().catch(() => {});
        }
      } catch (e) {
        document.getElementById("playerTitle").textContent = "Iniciá Iniciar_Marianflix_Web.bat para reproducir TV en vivo";
      }
    }

    function restartCurrentVideo() {
      const video = document.getElementById("videoEl");
      video.currentTime = 0;
      if (activePlayer.playKey) clearProgress(activePlayer.playKey);
      video.play().catch(() => {});
    }

    function closePlayer() {
      const video = document.getElementById("videoEl");
      if (!activePlayer.isLive && activePlayer.playKey && video.currentTime > 3) {
        saveProgress(activePlayer.playKey, video.currentTime, video.duration || activePlayer.durationSec, activePlayer.title, activePlayer.itemObj);
      }
      destroyActivePlayers();
      document.getElementById("playerModal").classList.remove("open");
      document.getElementById("trackPanel").classList.remove("open");
      render();
    }

    document.getElementById("videoEl").addEventListener("play", updatePlayPauseIcon);
    document.getElementById("videoEl").addEventListener("pause", updatePlayPauseIcon);
    document.getElementById("videoEl").addEventListener("timeupdate", function () {
      if (!activePlayer.isLive && !isScrubbing) {
        const cur = this.currentTime || 0;
        const dur = (isFinite(this.duration) && this.duration > 0) ? this.duration : (activePlayer.durationSec || 0);
        const slider = document.getElementById("nfSlider");
        if (slider && dur > 0) {
          slider.max = Math.floor(dur);
          slider.value = Math.floor(cur);
        }
        const curEl = document.getElementById("nfCurTime");
        const durEl = document.getElementById("nfDurTime");
        if (curEl) curEl.textContent = formatSec(cur);
        if (durEl && dur > 0) durEl.textContent = formatSec(dur);
      }
      const overlay = document.getElementById("subOverlay");
      if (!activePlayer.srtCues || !activePlayer.srtCues.length) {
        overlay.style.display = "none";
        return;
      }
      const t = this.currentTime;
      const cue = activePlayer.srtCues.find(c => t >= c.start && t <= c.end);
      if (cue) {
        overlay.textContent = cue.text;
        overlay.style.display = "block";
      } else {
        overlay.style.display = "none";
      }
    });

    initCatalog();
  </script>
