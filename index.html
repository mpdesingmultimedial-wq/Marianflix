    function render() {
      const activeEl = document.activeElement;
      const focusId = activeEl && (activeEl.id === "searchScreenInput" || activeEl.id === "liveSearchInput") ? activeEl.id : "";
      const selStart = focusId ? activeEl.selectionStart : null;
      const root = document.getElementById("appRoot");
      if (state.section !== "live" || state.liveTab !== 0) {
        stopLivePreview();
      }
      if (state.section === "home") {
        root.innerHTML = renderHome();
      } else if (state.section === "movies") {
        root.innerHTML = renderCatalogGrid("Películas", state.movies, "movie");
      } else if (state.section === "series") {
        root.innerHTML = renderCatalogGrid("Series", state.series, "series");
      } else if (state.section === "live") {
        root.innerHTML = renderLive();
        if (state.liveTab === 0 && state.liveChannels.length) {
          const lastId = localStorage.getItem("mf_web_last_live") || "";
          const target = state.selectedLiveChannelId || lastId || (state.liveChannels[0].channelCode || state.liveChannels[0].id);
          if (target) scheduleLivePreview(target);
        }
      } else if (state.section === "favs") {
        root.innerHTML = renderCatalogGrid("Favoritos ★", getFavorites(), "all");
      } else if (state.section === "search") {
        root.innerHTML = renderSearch();
      } else if (state.section === "settings") {
        root.innerHTML = renderSettings();
      }
      if (focusId) {
        const nextInp = document.getElementById(focusId);
        if (nextInp) {
          nextInp.focus();
          const pos = selStart !== null ? selStart : nextInp.value.length;
          try { nextInp.setSelectionRange(pos, pos); } catch (_) {}
        }
      }
    }

        .find(x => x && x.id === clean) || null;

    function parseSrtText(raw) {
      if (!raw) return [];
      const blocks = raw.replace(/\r\n/g, "\n").split(/\n\s*\n/);
      const regex = /(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})/;
      const cues = [];
      for (const b of blocks) {
        const lines = b.split("\n").map(l => l.trim()).filter(Boolean);
        if (lines.length < 2) continue;
        const idx = lines.findIndex(l => regex.test(l));
        if (idx < 0 || idx + 1 >= lines.length) continue;
        const m = lines[idx].match(regex);
        if (!m) continue;
        const toSec = (h, min, s, ms) => (+h * 3600) + (+min * 60) + (+s) + (+(ms.padEnd(3, "0").slice(0, 3)) / 1000);
        const start = toSec(m[1], m[2], m[3], m[4]);
        const end = toSec(m[5], m[6], m[7], m[8]);
        const text = lines.slice(idx + 1).join("\n").replace(/<[^>]*>/g, "").trim();
        if (text && end > start) cues.push({ start, end, text });
      }
      return cues;
    }

      if (c.includes("es") || c.includes("spa")) return "Español";
      if (c.includes("en") || c.includes("eng")) return "Inglés";
      if (c.includes("pt") || c.includes("por")) return "Portugués";
      if (c.includes("fr") || c.includes("fre")) return "Francés";
      return code.toUpperCase() || "Idioma";

      const next = Math.max(0, Math.min(maxDur - 1, (v.currentTime || 0) + deltaSec));
      v.currentTime = next;
      showSeekToast(deltaSec > 0 ? `+${deltaSec}s ↻` : `↺ ${deltaSec}s`);

    function startNextWebEpisodeCountdown() {
      if (activePlayer.isLive || !activePlayer.seriesId) return;
      const eps = activePlayer.episodes || [];
      if (eps.length < 2) return;
      const curIdx = eps.findIndex(e => String(e.id) === String(activePlayer.contentId));
      const nxt = curIdx >= 0 ? eps[curIdx + 1] : null;
      if (!nxt) return;
      cancelNextWebEpisode();
      pendingNextEp = nxt;
      nextEpRemaining = 5;
      const box = document.getElementById("nextEpBanner");
      const cntEl = document.getElementById("nextEpCountTxt");
      const ttlEl = document.getElementById("nextEpTitleTxt");
      if (ttlEl) ttlEl.textContent = `E${nxt.number || (curIdx + 2)} • ${nxt.title || nxt.name || "Siguiente"}`;
      if (cntEl) cntEl.textContent = `SIGUIENTE EPISODIO EN ${nextEpRemaining}s`;
      if (box) box.style.display = "flex";
      nextEpTimer = setInterval(() => {
        nextEpRemaining -= 1;
        if (nextEpRemaining <= 0) {
          playNextWebEpisodeNow();
        } else if (cntEl) {
          cntEl.textContent = `SIGUIENTE EPISODIO EN ${nextEpRemaining}s`;
        }
      }, 1000);

    window.addEventListener("keydown", (ev) => {
      const pinModal = document.getElementById("adultPinModal");
      if (pinModal && pinModal.classList.contains("open")) return;
      const modal = document.getElementById("playerModal");
      if (!modal || !modal.classList.contains("open")) return;
      if (activePlayer.isLive) {
        if (ev.key === "ArrowLeft") {
          ev.preventDefault();
          if (webLiveDrawerStep === 0) setWebLiveDrawerStep(1);
          else if (webLiveDrawerStep === 1) setWebLiveDrawerStep(2);
          return;
        }
        if (ev.key === "ArrowRight") {
          ev.preventDefault();
          if (webLiveDrawerStep === 2) setWebLiveDrawerStep(1);
          else if (webLiveDrawerStep === 1) setWebLiveDrawerStep(0);
          else if (webLiveDrawerStep === 0 && activePlayer.prevLiveCode) recallPrevLiveChannel();
          return;
        }
        if (webLiveDrawerStep > 0) {
          if (ev.key === "Escape") {
            ev.preventDefault();
            setWebLiveDrawerStep(webLiveDrawerStep === 2 ? 1 : 0);
            return;
          }
          if (ev.key === "ArrowUp" || ev.key === "ArrowDown") {
            ev.preventDefault();
            const delta = ev.key === "ArrowDown" ? 1 : -1;
            if (webLiveDrawerStep === 1) {
              const chs = getWebLiveDrawerChannels();
              if (chs.length) webLiveDrawerChIdx = (webLiveDrawerChIdx + delta + chs.length) % chs.length;
            } else {
              const cats = getWebLiveDrawerCategories();
              if (cats.length) webLiveDrawerCatIdx = (webLiveDrawerCatIdx + delta + cats.length) % cats.length;
            }
            renderWebLiveDrawer();
            return;
          }
          if (ev.key === "Enter") {
            ev.preventDefault();
            if (webLiveDrawerStep === 1) {
              const chs = getWebLiveDrawerChannels();
              const ch = chs[webLiveDrawerChIdx];
              if (ch) {
                startLivePlayback(ch.channelCode || ch.id, ch.name || ch.title || "Canal");
                setWebLiveDrawerStep(0);
              }
            } else {
              const cats = getWebLiveDrawerCategories();
              const cat = cats[webLiveDrawerCatIdx];
              if (cat) pickWebDrawerCategory(cat.id, cat.name);
            }
            return;
          }
          return;
        }
        if (ev.key === "ArrowUp") { ev.preventDefault(); zapLiveChannel(1); return; }
        if (ev.key === "ArrowDown") { ev.preventDefault(); zapLiveChannel(-1); return; }
      }
      if (ev.key === "ArrowRight") { ev.preventDefault(); seekRelative(10); }
      else if (ev.key === "ArrowLeft") { ev.preventDefault(); seekRelative(-10); }
      else if (ev.key === " ") { ev.preventDefault(); togglePlayPause(); }
      else if (ev.key === "Escape") { closePlayer(); }
    });

    function applyPreferredHlsQuality(hls) {
      if (!hls || !Array.isArray(hls.levels) || !hls.levels.length) return;
      const qPref = getPreferredQuality();
      if (qPref === "auto") {
        hls.autoLevelCapping = -1;
        hls.currentLevel = -1;
        return;
      }
      const maxH = parseInt(qPref, 10) || 1080;
      let bestIdx = -1;
      let bestH = 0;
      hls.levels.forEach((lvl, idx) => {
        const h = Number(lvl.height) || 0;
        if (h > 0 && h <= maxH && h >= bestH) {
          bestH = h;
          bestIdx = idx;
        }
      });
      if (bestIdx >= 0) {

    function loadVodEngine(resumeSec) {
      const video = document.getElementById("videoEl");
      if (activePlayer.hlsPlayer) { try { activePlayer.hlsPlayer.destroy(); } catch (_) {} activePlayer.hlsPlayer = null; }
      if (activePlayer.mpegtsPlayer) {
        try { activePlayer.mpegtsPlayer.unload(); activePlayer.mpegtsPlayer.detachMediaElement(); activePlayer.mpegtsPlayer.destroy(); } catch (_) {}
        activePlayer.mpegtsPlayer = null;
      }

      const audioIdx = activePlayer.selectedAudioIdx || 0;
      const hlsBase = activePlayer.hlsUrl ? (activePlayer.hlsUrl.startsWith("http") ? activePlayer.hlsUrl : (API_BASE + activePlayer.hlsUrl)) : "";
      const directUrl = activePlayer.streamUrl.startsWith("http") ? activePlayer.streamUrl : (API_BASE + activePlayer.streamUrl);

      if (hlsBase && window.Hls && Hls.isSupported()) {
        const hlsUrlWithAudio = `${hlsBase}?audio=${audioIdx}`;
        const hls = new Hls({ enableWorker: false, startPosition: resumeSec > 3 ? resumeSec : 0 });
        activePlayer.hlsPlayer = hls;
        hls.loadSource(hlsUrlWithAudio);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          if (resumeSec > 3) video.currentTime = resumeSec;
          video.play().catch(() => {});
          updatePlayPauseIcon();
        });
        hls.on(Hls.Events.ERROR, (ev, data) => {
          if (data && data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
            else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
          }
        });
      } else if (activePlayer.format === "ts" && window.mpegts && mpegts.isSupported()) {
        const player = mpegts.createPlayer({ type: "mpegts", isLive: false, url: directUrl }, { enableWorker: false, lazyLoadMaxDuration: 180 });
        activePlayer.mpegtsPlayer = player;
        player.attachMediaElement(video);
        player.load();
        video.addEventListener("loadedmetadata", function onMeta() {
          video.removeEventListener("loadedmetadata", onMeta);
          if (resumeSec > 3) video.currentTime = resumeSec;
          video.play().catch(() => {});
          updatePlayPauseIcon();
        });
      } else {
        video.src = directUrl;
        video.addEventListener("loadedmetadata", function onMeta() {
          video.removeEventListener("loadedmetadata", onMeta);
          if (resumeSec > 3) video.currentTime = resumeSec;
          video.play().catch(() => {});
          updatePlayPauseIcon();
        });
      }
    }

    function zapLiveChannel(delta) {
      if (!activePlayer.isLive || !state.liveChannels.length) return;
      const idx = state.liveChannels.findIndex(c => (c.channelCode || c.id) === activePlayer.liveCode);
      const nextIdx = ((idx < 0 ? 0 : idx) + delta + state.liveChannels.length) % state.liveChannels.length;
      const ch = state.liveChannels[nextIdx];
      startLivePlayback(ch.channelCode || ch.id, ch.name || ch.title || "Canal");
    }
    function findWebBackupChannel(failedCode, failedName, excluded) {
      const norm = s => String(s || "").toLowerCase().replace(/\([^)]*\)|\[[^\]]*\]|[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
      const target = norm(failedName);
      if (!target) return null;
      let best = null, bestScore = 0;
      for (const ch of state.liveChannels) {
        const code = ch.channelCode || ch.id;
        if (code === failedCode || excluded.has(code)) continue;
        const cand = norm(ch.name || ch.title);
        let score = 0;
        if (cand === target) score = 100;
        else if (cand.startsWith(target) || target.startsWith(cand)) score = 80;
        if (score > bestScore) { bestScore = score; best = ch; if (score === 100) break; }
      }
      return best;
    }

    async function startLivePlayback(code, name, failedSet) {
      destroyActivePlayers();
      stopLivePreview();
      const modal = document.getElementById("playerModal");
      modal.classList.add("open");
      localStorage.setItem("mf_web_last_live", String(code));
      if (activePlayer.isLive && activePlayer.liveCode && String(activePlayer.liveCode) !== String(code)) {
        activePlayer.prevLiveCode = String(activePlayer.liveCode);
        activePlayer.prevLiveName = String(activePlayer.liveName || "");
      }
      const recallBtn = document.getElementById("btnLiveRecall");
      if (recallBtn) {
        recallBtn.style.display = activePlayer.prevLiveCode ? "inline-flex" : "none";
      }
      activePlayer.liveCode = String(code);
      activePlayer.liveName = String(name);
      const excluded = failedSet || new Set();

      document.getElementById("playerTitle").textContent = "EN VIVO • " + name;
      document.getElementById("playerVodControls").style.display = "none";
      document.getElementById("playerLiveControls").style.display = "flex";
      document.getElementById("nfCenterControls").style.display = "none";
      document.getElementById("nfBottomBar").style.display = "none";
      document.getElementById("trackPanel").classList.remove("open");
      document.getElementById("subOverlay").style.display = "none";
      activePlayer.isLive = true;
      activePlayer.realVideoWidth = 0;
      activePlayer.realVideoHeight = 0;
      updateRealVideoResolutionBadge();
      applyWebVideoEnhance();
      updateLiveFavBtn();

      try {
        const chObj = state.liveChannels.find(c => String(c.channelCode || c.id) === String(code));
        let fullLiveUrl = "";
        if (chObj && chObj.streamUrl && /^https?:\/\//i.test(chObj.streamUrl)) {
          fullLiveUrl = chObj.streamUrl;
        } else {
          const pb = await apiGet(`/api/resolve-live?code=${encodeURIComponent(code)}`);
          fullLiveUrl = pb.streamUrl.startsWith("http") ? pb.streamUrl : (API_BASE + pb.streamUrl);
        }
        const video = document.getElementById("videoEl");
        video.controls = true;
        video.style.objectFit = liveZoomCover ? "cover" : "contain";
        activePlayer.hlsLevels = [];
        updateQualityButtonLabels();
        if (window.Hls && Hls.isSupported()) {
          const hls = new Hls({ enableWorker: false, lowLatencyMode: false });
          activePlayer.hlsPlayer = hls;
          hls.loadSource(fullLiveUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            activePlayer.hlsLevels = Array.isArray(hls.levels) ? hls.levels : [];
            applyPreferredHlsQuality(hls);
            updateQualityButtonLabels();
            video.play().catch(() => {});
          });
          hls.on(Hls.Events.LEVEL_SWITCHED, () => updateQualityButtonLabels());
          hls.on(Hls.Events.ERROR, (ev, data) => {
            if (data && data.fatal) {
              if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                hls.recoverMediaError();
              } else if (excluded.size < 3) {
                excluded.add(String(code));
                const backup = findWebBackupChannel(String(code), name, excluded);
                if (backup) {
                  showSeekToast("Respaldo: " + (backup.name || backup.title));
                  startLivePlayback(backup.channelCode || backup.id, backup.name || backup.title, excluded);
                }
              }
            }
          });
        } else {
          video.src = fullLiveUrl;
          video.play().catch(() => {});
        }
      } catch (e) {
        document.getElementById("playerTitle").textContent = "Iniciá Iniciar_Marianflix_Web.bat para reproducir TV en vivo";
      }
    }

      const lastLiveCode = activePlayer.liveCode;
      document.getElementById("playerModal").classList.remove("open");
      document.getElementById("trackPanel").classList.remove("open");
      setWebLiveDrawerStep(0);
      cancelNextWebEpisode();
      if (wasLive && lastLiveCode) {
        state.selectedLiveCode = lastLiveCode;
      }
      render();
      if (wasLive && lastLiveCode) {
        setTimeout(() => {
          const activeRow = document.querySelector(".flow-ch-item.active");
          if (activeRow && activeRow.scrollIntoView) activeRow.scrollIntoView({ block: "center" });
        }, 60);
      }
    }

    document.getElementById("videoEl").addEventListener("play", updatePlayPauseIcon);
    document.getElementById("videoEl").addEventListener("pause", updatePlayPauseIcon);
    document.getElementById("videoEl").addEventListener("ended", startNextWebEpisodeCountdown);
    document.getElementById("videoEl").addEventListener("loadedmetadata", updateRealVideoResolutionBadge);
    document.getElementById("videoEl").addEventListener("resize", updateRealVideoResolutionBadge);
    document.getElementById("videoEl").addEventListener("playing", updateRealVideoResolutionBadge);
    document.getElementById("videoEl").addEventListener("timeupdate", function () {
      if (!activePlayer.isLive && !isScrubbing) {
        const cur = this.currentTime || 0;
        const dur = (isFinite(this.duration) && this.duration > 0) ? this.duration : (activePlayer.durationSec || 0);
        const slider = document.getElementById("nfSlider");
        if (slider && dur > 0) {
          slider.max = Math.floor(dur);
          slider.value = Math.floor(cur);
        }
        const curEl = document.getElementById("nfCurTime");
        const durEl = document.getElementById("nfDurTime");
        if (curEl) curEl.textContent = formatSec(cur);
        if (durEl && dur > 0) durEl.textContent = formatSec(dur);
      }
      const overlay = document.getElementById("subOverlay");
      if (!activePlayer.srtCues || !activePlayer.srtCues.length) {
        overlay.style.display = "none";
        return;
      }
      const t = this.currentTime;
      const cue = activePlayer.srtCues.find(c => t >= c.start && t <= c.end);
      if (cue) {
        overlay.textContent = cue.text;
        overlay.style.display = "block";
      } else {
        overlay.style.display = "none";
      }
    });

    initCatalog();
  </script>
</body>
</html>
